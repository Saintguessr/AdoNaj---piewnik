<style>
  :root{
    --bg:#0f172a; --bg2:#1e293b; --card:#1e293b; --card2:#243247;
    --text:#f1f5f9; --muted:#94a3b8; --accent:#facc15; --accent2:#fbbf24;
    --border:#334155; --chord:#fbbf24;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;
  }
  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  /* ---------- Header ---------- */
  header{
    padding:calc(14px + var(--safe-top)) 16px 12px;
    background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:5;
  }
  header h1{
    margin:0 0 10px; font-size:20px; font-weight:700; letter-spacing:.2px;
    display:flex; align-items:center; gap:8px;
  }
  header h1 .dot{color:var(--accent);}
  .search-wrap{position:relative;}
  #search{
    width:100%; padding:11px 38px 11px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:16px; outline:none;
  }
  #search:focus{border-color:var(--accent);}
  .search-wrap .clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); font-size:20px; padding:6px; cursor:pointer; display:none;
  }
  .count{color:var(--muted); font-size:12px; margin-top:8px;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex; gap:6px; margin-bottom:10px;}
  .tab-btn{
    flex:1; padding:8px 10px; border-radius:10px; border:1px solid var(--border);
    background:var(--card2); color:var(--muted); font-size:14px; font-weight:600; cursor:pointer;
  }
  .tab-btn.active{background:var(--accent); color:#1e1b0a; border-color:var(--accent);}

  /* ---------- List ---------- */
  #list-view{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .letter-header{
    position:sticky; top:0; background:var(--bg); color:var(--accent);
    font-size:12px; font-weight:700; padding:6px 16px; letter-spacing:1px;
    border-bottom:1px solid var(--border);
  }
  ul.songs{list-style:none; margin:0; padding:0 0 calc(24px + var(--safe-bottom));}
  ul.songs li{
    border-bottom:1px solid var(--border);
  }
  ul.songs li button{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:14px 16px; font-size:16px; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer;
  }
  ul.songs li button:active{background:var(--card2);}
  ul.songs li button .chev{color:var(--muted); font-size:18px;}
  .empty{padding:40px 20px; text-align:center; color:var(--muted);}

  /* ---------- Playlists (setlisty) pane ---------- */
  #playlistsPane{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(24px + var(--safe-bottom));}
  .pl-toolbar{padding:4px 16px 14px;}
  .pl-new-btn{
    width:100%; padding:12px; border-radius:12px; border:1px dashed var(--accent);
    background:none; color:var(--accent); font-size:15px; font-weight:700; cursor:pointer;
  }
  .pl-new-btn:active{background:var(--card2);}
  .pl-sync-btn{
    width:100%; margin-top:8px; padding:10px; border-radius:12px; border:1px solid var(--border);
    background:var(--card2); color:var(--muted); font-size:13px; cursor:pointer;
  }
  .pl-sync-btn.active{color:var(--accent); border-color:var(--accent);}
  ul.playlists{list-style:none; margin:0; padding:0;}
  ul.playlists li{
    display:flex; align-items:center; border-bottom:1px solid var(--border);
  }
  ul.playlists li button.pl-open{
    flex:1; text-align:left; background:none; border:none; color:var(--text);
    padding:14px 16px; font-size:16px; cursor:pointer; display:flex; flex-direction:column; gap:2px;
  }
  ul.playlists li button.pl-open:active{background:var(--card2);}
  ul.playlists li .pl-count{color:var(--muted); font-size:12px;}
  .pl-del{
    background:none; border:none; color:var(--muted); font-size:20px; padding:14px 16px; cursor:pointer;
  }
  .pl-del:active{color:#f87171;}

  /* ---------- Detail view ---------- */
  #detail-view{
    position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:10;
  }
  #detail-view.open{display:flex;}
  .detail-header{
    padding:calc(12px + var(--safe-top)) 8px 10px 8px;
    background:var(--bg2); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px;
  }
  .back-btn{
    background:none; border:none; color:var(--accent); font-size:16px; padding:8px 10px;
    display:flex; align-items:center; gap:4px; cursor:pointer; border-radius:8px;
  }
  .back-btn:active{background:var(--card2);}
  .detail-title{
    flex:1; font-size:16px; font-weight:700; padding-right:8px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .font-controls{display:flex; gap:4px;}
  .font-controls button{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:16px; cursor:pointer;
  }
  #song-body-wrap{flex:1; overflow:auto; -webkit-overflow-scrolling:touch;}
  pre#song-body{
    margin:0; padding:18px 16px calc(40px + var(--safe-bottom));
    font-family:"SF Mono", "Roboto Mono", Menlo, Consolas, "Courier New", monospace;
    font-size:15px; line-height:1.55; white-space:pre; overflow-x:auto;
    tab-size:4; -moz-tab-size:4;
  }
  /* chord-looking tokens (heuristic highlight) are wrapped server-side via span.chordline is not used;
     instead we color whole lines that look chord-only using a class added by JS */
  .chord-line{color:var(--chord); font-weight:700;}
  .ref-line{color:#38bdf8;}

  /* ---------- Add-to-setlist button (song reading header) ---------- */
  .pl-add-btn{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
    background:var(--card2); color:var(--accent); font-size:16px; cursor:pointer; margin-right:4px;
  }

  /* ---------- Playlist detail view ---------- */
  #playlist-detail-view, #playlist-picker-view{
    position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:10;
  }
  #playlist-detail-view.open, #playlist-picker-view.open{display:flex; z-index:11;}
  .pld-header-row{display:flex; align-items:center; gap:4px;}
  .pld-title-btn{
    flex:1; text-align:left; background:none; border:none; color:var(--text);
    font-size:16px; font-weight:700; padding:8px 4px; cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pld-icon-btn{
    background:none; border:none; color:var(--muted); font-size:18px; padding:8px; cursor:pointer;
  }
  .pld-icon-btn:active{color:var(--accent);}
  #playlistSongsContainer{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .pld-empty{padding:40px 20px; text-align:center; color:var(--muted);}
  ul.pld-songs{list-style:none; margin:0; padding:8px 0 calc(80px + var(--safe-bottom));}
  ul.pld-songs li{
    display:flex; align-items:center; gap:2px; border-bottom:1px solid var(--border); padding:0 8px;
  }
  ul.pld-songs li .pld-num{color:var(--muted); font-size:13px; width:22px; text-align:right; flex-shrink:0;}
  ul.pld-songs li button.pld-song-btn{
    flex:1; text-align:left; background:none; border:none; color:var(--text);
    padding:13px 8px; font-size:15px; cursor:pointer; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  ul.pld-songs li .pld-controls{display:flex; gap:2px; flex-shrink:0;}
  ul.pld-songs li .pld-controls button{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border);
    background:var(--card2); color:var(--muted); font-size:14px; cursor:pointer;
  }
  ul.pld-songs li .pld-controls button:disabled{opacity:.3;}
  ul.pld-songs li .pld-controls button.pld-remove{color:#f87171;}
  .pld-add-footer{
    position:sticky; bottom:0; padding:12px 16px calc(12px + var(--safe-bottom));
    background:linear-gradient(0deg,var(--bg) 60%, transparent); 
  }
  .pld-add-btn{
    width:100%; padding:12px; border-radius:12px; border:none;
    background:var(--accent); color:#1e1b0a; font-size:15px; font-weight:700; cursor:pointer;
  }

  /* ---------- Playlist picker (add songs) ---------- */
  #pickerListContainer{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  ul.picker-songs{list-style:none; margin:0; padding:0 0 calc(24px + var(--safe-bottom));}
  ul.picker-songs li button{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:14px 16px; font-size:16px; display:flex; align-items:center; gap:12px; cursor:pointer;
  }
  ul.picker-songs li button:active{background:var(--card2);}
  .picker-check{
    width:22px; height:22px; border-radius:6px; border:2px solid var(--border);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .picker-check.checked{background:var(--accent); border-color:var(--accent); color:#1e1b0a; font-weight:700;}

  /* ---------- Quick add-to-setlist modal (from song reading view) ---------- */
  #quickAddBackdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:20;
    align-items:flex-end; justify-content:center;
  }
  #quickAddBackdrop.open{display:flex;}
  #quickAddSheet{
    width:100%; max-width:480px; background:var(--bg2); border-radius:16px 16px 0 0;
    border:1px solid var(--border); border-bottom:none;
    padding:16px 16px calc(16px + var(--safe-bottom)); max-height:70vh; overflow-y:auto;
  }
  #quickAddSheet h3{margin:0 0 12px; font-size:15px; color:var(--muted); font-weight:700;}
  ul.quick-pl-list{list-style:none; margin:0 0 12px; padding:0;}
  ul.quick-pl-list li button{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:12px 4px; font-size:15px; display:flex; align-items:center; gap:12px; cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .quick-new-row{display:flex; gap:8px; margin-top:4px;}
  .quick-new-row button{
    padding:10px 14px; border-radius:10px; border:1px dashed var(--accent);
    background:none; color:var(--accent); font-size:14px; font-weight:700; cursor:pointer; width:100%;
  }

  /* ---------- Custom dialog (replaces native prompt/confirm/alert, which
     are unreliable inside an installed/standalone PWA on many phones) ---------- */
  #customDialogBackdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:30;
    align-items:center; justify-content:center; padding:20px;
  }
  #customDialogBackdrop.open{display:flex;}
  #customDialogSheet{
    width:100%; max-width:360px; background:var(--bg2); border-radius:16px;
    border:1px solid var(--border); padding:20px;
  }
  #customDialogMessage{
    margin:0 0 14px; font-size:15px; color:var(--text); line-height:1.4; white-space:pre-line;
  }
  #customDialogInput{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:16px; outline:none; margin-bottom:16px; box-sizing:border-box;
  }
  #customDialogInput:focus{border-color:var(--accent);}
  .dialog-buttons{display:flex; gap:10px; justify-content:flex-end;}
  .dialog-buttons button{
    padding:10px 18px; border-radius:10px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:14px; font-weight:700; cursor:pointer;
  }
  #customDialogOk{background:var(--accent); color:#1e1b0a; border-color:var(--accent);}
</style>

<div id="debugErrorBanner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#dc2626; color:#fff; padding:10px 14px; font-family:monospace; font-size:12px; white-space:pre-wrap; max-height:45vh; overflow:auto; box-sizing:border-box;"></div>
<script>
(function(){
  var banner = document.getElementById('debugErrorBanner');
  function show(msg){
    banner.style.display = 'block';
    banner.textContent += (banner.textContent ? '\n\n---\n\n' : '') + msg;
  }
  window.addEventListener('error', function(e){
    show('BŁĄD JS: ' + e.message + '\nplik: ' + (e.filename||'?') + ' linia:' + (e.lineno||'?') + ' kol:' + (e.colno||'?'));
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    var msg = (r && r.message) ? r.message : String(r);
    show('NIEOBSŁUŻONY BŁĄD (Promise): ' + msg);
  });
  window.__spiewnikDebugShow = show;
})();
</script>

<script type="module">
  // ---------- Firebase (cross-device setlist sync) ----------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADWqBD7BHltXrtEPq5nzcQPXbj_EFb1ME",
    authDomain: "spiewnik-adonaj.firebaseapp.com",
    projectId: "spiewnik-adonaj",
    storageBucket: "spiewnik-adonaj.firebasestorage.app",
    messagingSenderId: "1057517558031",
    appId: "1:1057517558031:web:74614b50afe7ff7180867a"
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);
  const fbDb = getFirestore(fbApp);

  let authReadyPromise = null;
  function ensureAuth(){
    if(!authReadyPromise){
      authReadyPromise = new Promise((resolve) => {
        onAuthStateChanged(fbAuth, user => {
          if(user) resolve(user);
          else signInAnonymously(fbAuth).catch(() => resolve(null));
        });
      });
    }
    return authReadyPromise;
  }

  function getSyncCode(){
    return localStorage.getItem('spiewnik_sync_code') || '';
  }

  let syncUnsub = null;

  async function connectSync(code, onRemoteUpdate){
    if(syncUnsub){ syncUnsub(); syncUnsub = null; }
    localStorage.setItem('spiewnik_sync_code', code);
    await ensureAuth();
    const ref = doc(fbDb, 'syncs', code);
    const snap = await getDoc(ref);
    if(snap.exists()){
      const remote = (snap.data() && snap.data().playlists) || [];
      localStorage.setItem('spiewnik_playlists', JSON.stringify(remote));
      onRemoteUpdate(remote);
    } else {
      const local = JSON.parse(localStorage.getItem('spiewnik_playlists') || '[]');
      await setDoc(ref, { playlists: local, updatedAt: Date.now() });
    }
    syncUnsub = onSnapshot(ref, (snap2) => {
      if(snap2.metadata.hasPendingWrites) return;
      const remote = (snap2.data() && snap2.data().playlists) || [];
      localStorage.setItem('spiewnik_playlists', JSON.stringify(remote));
      onRemoteUpdate(remote);
    }, () => { /* connection error - ignore, local copy remains authoritative */ });
  }

  function disconnectSync(){
    if(syncUnsub){ syncUnsub(); syncUnsub = null; }
    localStorage.removeItem('spiewnik_sync_code');
  }

  async function pushToCloudIfConnected(list){
    const code = getSyncCode();
    if(!code) return;
    try {
      await ensureAuth();
      const ref = doc(fbDb, 'syncs', code);
      await setDoc(ref, { playlists: list, updatedAt: Date.now() });
    } catch(e){ /* offline / blocked - local copy already saved, will retry on next change */ }
  }

  // ---------- Main app ----------

  const listContainer = document.getElementById('listContainer');
  const searchInput = document.getElementById('search');
  const clearBtn = document.getElementById('clearBtn');
  const countEl = document.getElementById('count');
  const detailView = document.getElementById('detail-view');

  const backBtn = document.getElementById('backBtn');
  const fontMinus = document.getElementById('fontMinus');
  const fontPlus = document.getElementById('fontPlus');
  const addToPlaylistBtn = document.getElementById('addToPlaylistBtn');

  const tabSongs = document.getElementById('tabSongs');
  const tabPlaylists = document.getElementById('tabPlaylists');
  const songsHeaderExtra = document.getElementById('songsHeaderExtra');
  const songsPane = document.getElementById('songsPane');
  const playlistsPane = document.getElementById('playlistsPane');
  const playlistsContainer = document.getElementById('playlistsContainer');
  const newPlaylistBtn = document.getElementById('newPlaylistBtn');
  const syncBtn = document.getElementById('syncBtn');

  const playlistDetailView = document.getElementById('playlist-detail-view');
  const pldBackBtn = document.getElementById('pldBackBtn');
  const pldTitleBtn = document.getElementById('pldTitleBtn');
  const pldDeleteBtn = document.getElementById('pldDeleteBtn');
  const playlistSongsContainer = document.getElementById('playlistSongsContainer');
  const pldAddSongBtn = document.getElementById('pldAddSongBtn');

  const playlistPickerView = document.getElementById('playlist-picker-view');
  const pickerBackBtn = document.getElementById('pickerBackBtn');
  const pickerListContainer = document.getElementById('pickerListContainer');
  const pickerSearch = document.getElementById('pickerSearch');
  const pickerClearBtn = document.getElementById('pickerClearBtn');

  const quickAddBackdrop = document.getElementById('quickAddBackdrop');
  const quickAddSongTitle = document.getElementById('quickAddSongTitle');
  const quickAddList = document.getElementById('quickAddList');
  const quickAddNewBtn = document.getElementById('quickAddNewBtn');

  const customDialogBackdrop = document.getElementById('customDialogBackdrop');
  const customDialogMessage = document.getElementById('customDialogMessage');
  const customDialogInput = document.getElementById('customDialogInput');
  const customDialogCancel = document.getElementById('customDialogCancel');
  const customDialogOk = document.getElementById('customDialogOk');

  function normalize(s){
    return s.toLowerCase()
      .replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l')
      .replace(/ń/g,'n').replace(/ó/g,'o').replace(/ś/g,'s').replace(/ź/g,'z').replace(/ż/g,'z');
  }

  const songsIndexed = SONGS.map((s,i) => ({...s, idx:i, norm: normalize(s.title)}));
  const titleToIdx = {};
  songsIndexed.forEach(s => { titleToIdx[s.title] = s.idx; });

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function render(filterText){
    const q = normalize(filterText || '');
    const filtered = q ? songsIndexed.filter(s => s.norm.includes(q)) : songsIndexed;

    countEl.textContent = filtered.length === songsIndexed.length
      ? (songsIndexed.length + ' pieśni')
      : ('Znaleziono: ' + filtered.length);

    if(filtered.length === 0){
      listContainer.innerHTML = '<div class="empty">Brak wyników dla podanej frazy.</div>';
      return;
    }

    let html = '';
    let lastLetter = null;
    let ul = '';
    filtered.forEach(s => {
      const letter = s.title.charAt(0).toUpperCase();
      if(letter !== lastLetter){
        if(ul){ html += '<ul class="songs">' + ul + '</ul>'; ul = ''; }
        html += '<div class="letter-header">' + letter + '</div>';
        lastLetter = letter;
      }
      ul += '<li><button data-idx="' + s.idx + '">' + escapeHtml(s.title) + '<span class="chev">›</span></button></li>';
    });
    if(ul){ html += '<ul class="songs">' + ul + '</ul>'; }
    listContainer.innerHTML = html;
  }

  // Heuristic: a line is a "chord line" if, once split on whitespace, every
  // token looks like a chord symbol. Supports both major (uppercase root,
  // e.g. G, C7, D/Fis) and Polish minor notation (lowercase root, e.g.
  // a, h, fis, cis, gis, dis, ais - the h/is/es forms used for minor chords
  // and sharps/flats in Polish chord charts), plus slash chords, sus/maj/
  // min/dim/aug/add qualifiers and numeric extensions (7, 9, sus4...).
  const CHORD_TOKEN = /^\(?(?:[A-H]|[a-h])(?:is|es|s)?(?:sus|maj|min|dim|aug|add|m)?[0-9]*[\+\-]?(?:\/(?:(?:[A-H]|[a-h])(?:is|es|s)?[0-9]*)?)?\)?$/;
  function isChordLine(line){
    const trimmed = line.trim();
    if(!trimmed) return false;
    const tokens = trimmed.split(/\s+/);
    if(tokens.length === 0) return false;
    let chordish = 0;
    tokens.forEach(t => { if(CHORD_TOKEN.test(t)) chordish++; });
    return chordish / tokens.length >= 0.8;
  }
  function isRefLine(line){
    return /^\s*(Ref\.?|Refren|REFREN|Bridge|BRIDGE|Coda)\b/i.test(line);
  }

  // ---------- Overlay stack: keeps every full-screen view / sheet in sync
  // with browser history so the hardware/software back button always closes
  // exactly the thing currently on top, however deep the user navigated. ----------
  const overlayStack = [];
  function openOverlay(el){
    console.log('[DEBUG] openOverlay() dla elementu id=', el.id, '- stan historii PRZED:', JSON.stringify(history.state));
    el.classList.add('open');
    overlayStack.push(el);
    history.pushState({n: overlayStack.length}, '');
    console.log('[DEBUG] openOverlay() zakończone - stan historii PO:', JSON.stringify(history.state), 'overlayStack.length=', overlayStack.length);
  }
  let dialogResolve = null;
  let dialogPendingResult = null;
  function closeTopOverlay(){
    const elClosed = overlayStack.pop();
    if(elClosed){
      elClosed.classList.remove('open');
      if(elClosed === customDialogBackdrop && dialogResolve){
        const resolveFn = dialogResolve;
        const result = dialogPendingResult;
        dialogResolve = null;
        dialogPendingResult = null;
        resolveFn(result);
      }
    }
  }
  window.addEventListener('popstate', (e) => {
    console.log('[DEBUG] popstate - e.state=', JSON.stringify(e.state), 'overlayStack.length PRZED=', overlayStack.length);
    const target = (e.state && e.state.n) || 0;
    while(overlayStack.length > target){ closeTopOverlay(); }
    console.log('[DEBUG] popstate zakończone - overlayStack.length PO=', overlayStack.length);
  });
  function goBack(){ console.log('[DEBUG] goBack() -> history.back()'); history.back(); }

  // ---------- Custom dialog: replaces window.prompt/confirm/alert. Native
  // dialogs are unreliable inside an installed/standalone PWA on many
  // phones (can silently fail or freeze script execution), so every user
  // interaction that used to rely on them now goes through this instead -
  // it's a normal DOM overlay, fully integrated with the same back-button
  // stack as every other screen. ----------
  function showDialog(opts){
    return new Promise((resolve) => {
      dialogResolve = resolve;
      dialogPendingResult = null;
      customDialogMessage.textContent = opts.message || '';
      if(opts.showInput){
        customDialogInput.style.display = '';
        customDialogInput.value = opts.defaultValue || '';
      } else {
        customDialogInput.style.display = 'none';
      }
      customDialogCancel.style.display = opts.hideCancel ? 'none' : '';
      openOverlay(customDialogBackdrop);
      if(opts.showInput){
        setTimeout(() => { customDialogInput.focus(); customDialogInput.select(); }, 50);
      }
    });
  }
  function customPrompt(message, defaultValue){
    return showDialog({ message, showInput: true, defaultValue });
  }
  function customConfirm(message){
    return showDialog({ message, showInput: false }).then(r => r === true);
  }
  function customAlert(message){
    return showDialog({ message, showInput: false, hideCancel: true });
  }
  customDialogOk.addEventListener('click', () => {
    dialogPendingResult = (customDialogInput.style.display !== 'none') ? customDialogInput.value : true;
    goBack();
  });
  customDialogCancel.addEventListener('click', () => {
    dialogPendingResult = null;
    goBack();
  });
  customDialogBackdrop.addEventListener('click', e => {
    if(e.target === customDialogBackdrop){ dialogPendingResult = null; goBack(); }
  });
  customDialogInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ dialogPendingResult = customDialogInput.value; goBack(); }
  });

  // ---------- Song reading view ----------
  let currentSongIdx = null;
  function openSong(idx){
    console.log('[DEBUG] openSong() wywołane z idx=', idx, 'typeof idx:', typeof idx);
    currentSongIdx = idx;
    const s = SONGS[idx];
    console.log('[DEBUG] SONGS[idx] =', s ? s.title : 'UNDEFINED - to jest problem!');
    if(!s){
      console.log('[DEBUG] PRZERYWAM - brak pieśni pod tym indeksem w SONGS. Długość SONGS:', SONGS.length);
      return;
    }
    detailTitle.textContent = s.title;
    const lines = s.body.split('\n');
    const frag = document.createDocumentFragment();
    songBody.innerHTML = '';
    lines.forEach((line, i) => {
      const span = document.createElement('span');
      if(isChordLine(line)) span.className = 'chord-line';
      else if(isRefLine(line)) span.className = 'ref-line';
      span.textContent = line;
      frag.appendChild(span);
      if(i < lines.length - 1) frag.appendChild(document.createTextNode('\n'));
    });
    songBody.appendChild(frag);
    document.getElementById('song-body-wrap').scrollTop = 0;
    console.log('[DEBUG] wywołuję openOverlay(detailView)');
    openOverlay(detailView);
    console.log('[DEBUG] openOverlay zakończone, detailView ma klasę open:', detailView.classList.contains('open'));
  }

  listContainer.addEventListener('click', e => {
    const btn = e.target.closest('button[data-idx]');
    if(btn) openSong(parseInt(btn.dataset.idx,10));
  });

  backBtn.addEventListener('click', goBack);

  searchInput.addEventListener('input', () => {
    clearBtn.style.display = searchInput.value ? 'block' : 'none';
    render(searchInput.value);
  });
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    render('');
    searchInput.focus();
  });

  let fontSize = parseInt(localStorage.getItem('spiewnik_fontsize') || '15', 10);
  function applyFont(){
    songBody.style.fontSize = fontSize + 'px';
    localStorage.setItem('spiewnik_fontsize', String(fontSize));
  }
  fontMinus.addEventListener('click', () => { fontSize = Math.max(11, fontSize-1); applyFont(); });
  fontPlus.addEventListener('click', () => { fontSize = Math.min(26, fontSize+1); applyFont(); });
  applyFont();

  // ---------- Tabs: Pieśni / Setlisty ----------
  tabSongs.addEventListener('click', () => {
    tabSongs.classList.add('active'); tabPlaylists.classList.remove('active');
    songsPane.style.display = ''; playlistsPane.style.display = 'none';
    songsHeaderExtra.style.display = '';
  });
  tabPlaylists.addEventListener('click', () => {
    tabPlaylists.classList.add('active'); tabSongs.classList.remove('active');
    playlistsPane.style.display = ''; songsPane.style.display = 'none';
    songsHeaderExtra.style.display = 'none';
    renderPlaylists();
  });

  // ---------- Playlists (setlisty) data layer ----------
  function loadPlaylists(){
    try {
      const raw = localStorage.getItem('spiewnik_playlists');
      return raw ? JSON.parse(raw) : [];
    } catch(e){ return []; }
  }
  function savePlaylists(list){
    try { localStorage.setItem('spiewnik_playlists', JSON.stringify(list)); } catch(e){}
    pushToCloudIfConnected(list);
  }
  function genId(){
    return 'pl_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function getPlaylist(id){
    return loadPlaylists().find(p => p.id === id) || null;
  }
  function updatePlaylist(id, mutateFn){
    const lists = loadPlaylists();
    const pl = lists.find(p => p.id === id);
    if(!pl) return;
    mutateFn(pl);
    savePlaylists(lists);
  }

  function renderPlaylists(){
    const lists = loadPlaylists();
    if(lists.length === 0){
      playlistsContainer.innerHTML = '<div class="empty">Brak setlist. Utwórz pierwszą powyżej.</div>';
      return;
    }
    let html = '<ul class="playlists">';
    lists.forEach(pl => {
      html += '<li>'
        + '<button class="pl-open" data-id="' + pl.id + '">'
        + '<span>' + escapeHtml(pl.name) + '</span>'
        + '<span class="pl-count">' + pl.songs.length + ' pieśni</span>'
        + '</button>'
        + '<button class="pl-del" data-id="' + pl.id + '">✕</button>'
        + '</li>';
    });
    html += '</ul>';
    playlistsContainer.innerHTML = html;
  }

  newPlaylistBtn.addEventListener('click', async () => {
    const name = await customPrompt('Nazwa nowej setlisty:');
    if(!name || !name.trim()) return;
    const lists = loadPlaylists();
    const pl = { id: genId(), name: name.trim(), songs: [] };
    lists.push(pl);
    savePlaylists(lists);
    renderPlaylists();
    openPlaylistDetail(pl.id);
  });

  // ---------- Sync UI ----------
  function refreshSyncStatus(tempText){
    const code = getSyncCode();
    if(tempText){
      syncBtn.textContent = tempText;
      syncBtn.classList.remove('active');
      return;
    }
    if(code){
      syncBtn.textContent = '🔄 Synchronizacja: ' + code;
      syncBtn.classList.add('active');
    } else {
      syncBtn.textContent = '🔄 Synchronizacja wyłączona';
      syncBtn.classList.remove('active');
    }
  }

  function onRemoteSyncUpdate(){
    renderPlaylists();
    if(playlistDetailView.classList.contains('open')){
      renderPlaylistSongs();
      renderPlaylistDetailHeader();
    }
  }

  syncBtn.addEventListener('click', async () => {
    const current = getSyncCode();
    const input = await customPrompt(
      'Podaj kod synchronizacji - ten sam kod wpisany na innym urządzeniu automatycznie połączy Wasze setlisty.\n\nZostaw puste pole i zatwierdź, aby wyłączyć synchronizację.',
      current
    );
    if(input === null) return;
    const trimmed = input.trim();
    if(!trimmed){
      disconnectSync();
      refreshSyncStatus();
      return;
    }
    refreshSyncStatus('🔄 Łączenie…');
    try {
      await connectSync(trimmed, onRemoteSyncUpdate);
      refreshSyncStatus();
      renderPlaylists();
    } catch(e){
      await customAlert('Nie udało się połączyć z synchronizacją. Sprawdź połączenie z internetem i spróbuj ponownie.');
      refreshSyncStatus();
    }
  });

  refreshSyncStatus();
  if(getSyncCode()){
    connectSync(getSyncCode(), onRemoteSyncUpdate).then(() => {
      refreshSyncStatus();
      renderPlaylists();
    }).catch(() => { refreshSyncStatus(); });
  }

  playlistsContainer.addEventListener('click', async e => {
    const delBtn = e.target.closest('button.pl-del');
    if(delBtn){
      const id = delBtn.dataset.id;
      const pl = getPlaylist(id);
      if(pl && await customConfirm('Usunąć setlistę "' + pl.name + '"?')){
        savePlaylists(loadPlaylists().filter(p => p.id !== id));
        renderPlaylists();
      }
      return;
    }
    const openBtn = e.target.closest('button.pl-open');
    if(openBtn) openPlaylistDetail(openBtn.dataset.id);
  });

  // ---------- Playlist detail (setlist contents, reorder, remove) ----------
  let currentPlaylistId = null;

  function openPlaylistDetail(id){
    currentPlaylistId = id;
    renderPlaylistDetailHeader();
    renderPlaylistSongs();
    openOverlay(playlistDetailView);
  }
  function renderPlaylistDetailHeader(){
    const pl = getPlaylist(currentPlaylistId);
    pldTitleBtn.textContent = pl ? pl.name : '';
  }
  function renderPlaylistSongs(){
    const pl = getPlaylist(currentPlaylistId);
    if(!pl){ playlistSongsContainer.innerHTML = ''; return; }
    if(pl.songs.length === 0){
      playlistSongsContainer.innerHTML = '<div class="pld-empty">Brak pieśni w tej setliście. Dodaj je przyciskiem poniżej.</div>';
      return;
    }
    let html = '<ul class="pld-songs">';
    pl.songs.forEach((title, i) => {
      const idx = titleToIdx[title];
      const known = idx !== undefined;
      html += '<li>'
        + '<span class="pld-num">' + (i+1) + '.</span>'
        + '<button class="pld-song-btn"' + (known ? ' data-idx="'+idx+'"' : ' disabled style="opacity:.4"') + '>' + escapeHtml(title) + '</button>'
        + '<span class="pld-controls">'
        + '<button class="pld-up" data-i="' + i + '"' + (i===0?' disabled':'') + '>↑</button>'
        + '<button class="pld-down" data-i="' + i + '"' + (i===pl.songs.length-1?' disabled':'') + '>↓</button>'
        + '<button class="pld-remove" data-i="' + i + '">✕</button>'
        + '</span>'
        + '</li>';
    });
    html += '</ul>';
    playlistSongsContainer.innerHTML = html;
  }

  playlistSongsContainer.addEventListener('click', e => {
    console.log('[DEBUG] KLIKNIĘCIE w #playlistSongsContainer, e.target =', e.target.tagName, e.target.className);
    const upBtn = e.target.closest('button.pld-up');
    const downBtn = e.target.closest('button.pld-down');
    const remBtn = e.target.closest('button.pld-remove');
    const songBtn = e.target.closest('button.pld-song-btn');
    console.log('[DEBUG] songBtn znaleziony?', !!songBtn, songBtn ? ('data-idx=' + songBtn.dataset.idx + ' disabled=' + songBtn.disabled) : '');
    if(upBtn){
      const i = parseInt(upBtn.dataset.i,10);
      updatePlaylist(currentPlaylistId, pl => {
        if(i>0){ const tmp = pl.songs[i-1]; pl.songs[i-1]=pl.songs[i]; pl.songs[i]=tmp; }
      });
      renderPlaylistSongs();
      return;
    }
    if(downBtn){
      const i = parseInt(downBtn.dataset.i,10);
      updatePlaylist(currentPlaylistId, pl => {
        if(i<pl.songs.length-1){ const tmp = pl.songs[i+1]; pl.songs[i+1]=pl.songs[i]; pl.songs[i]=tmp; }
      });
      renderPlaylistSongs();
      return;
    }
    if(remBtn){
      const i = parseInt(remBtn.dataset.i,10);
      updatePlaylist(currentPlaylistId, pl => { pl.songs.splice(i,1); });
      renderPlaylistSongs();
      renderPlaylistDetailHeader();
      return;
    }
    if(songBtn && songBtn.dataset.idx !== undefined){
      console.log('[DEBUG] wywołuję openSong z data-idx =', songBtn.dataset.idx);
      openSong(parseInt(songBtn.dataset.idx,10));
    }
  });

  pldBackBtn.addEventListener('click', goBack);

  pldTitleBtn.addEventListener('click', async () => {
    const pl = getPlaylist(currentPlaylistId);
    if(!pl) return;
    const name = await customPrompt('Nowa nazwa setlisty:', pl.name);
    if(!name || !name.trim()) return;
    updatePlaylist(currentPlaylistId, p => { p.name = name.trim(); });
    renderPlaylistDetailHeader();
    renderPlaylists();
  });

  pldDeleteBtn.addEventListener('click', async () => {
    const pl = getPlaylist(currentPlaylistId);
    if(!pl) return;
    if(await customConfirm('Usunąć setlistę "' + pl.name + '"?')){
      savePlaylists(loadPlaylists().filter(p => p.id !== currentPlaylistId));
      renderPlaylists();
      goBack();
    }
  });

  pldAddSongBtn.addEventListener('click', () => {
    openPicker();
  });

  // ---------- Picker: search + toggle songs into the current setlist ----------
  function renderPicker(filterText){
    const pl = getPlaylist(currentPlaylistId);
    if(!pl) return;
    const q = normalize(filterText || '');
    const filtered = q ? songsIndexed.filter(s => s.norm.includes(q)) : songsIndexed;
    if(filtered.length === 0){
      pickerListContainer.innerHTML = '<div class="empty">Brak wyników.</div>';
      return;
    }
    let html = '<ul class="picker-songs">';
    filtered.forEach(s => {
      const inList = pl.songs.includes(s.title);
      html += '<li><button data-title="' + escapeHtml(s.title) + '">'
        + '<span class="picker-check' + (inList?' checked':'') + '">' + (inList?'✓':'') + '</span>'
        + '<span>' + escapeHtml(s.title) + '</span>'
        + '</button></li>';
    });
    html += '</ul>';
    pickerListContainer.innerHTML = html;
  }

  function openPicker(){
    pickerSearch.value = '';
    pickerClearBtn.style.display = 'none';
    renderPicker('');
    openOverlay(playlistPickerView);
  }

  pickerListContainer.addEventListener('click', e => {
    const btn = e.target.closest('button[data-title]');
    if(!btn) return;
    const title = btn.dataset.title;
    updatePlaylist(currentPlaylistId, pl => {
      const i = pl.songs.indexOf(title);
      if(i === -1) pl.songs.push(title); else pl.songs.splice(i,1);
    });
    renderPicker(pickerSearch.value);
    renderPlaylistSongs();
    renderPlaylistDetailHeader();
  });

  pickerSearch.addEventListener('input', () => {
    pickerClearBtn.style.display = pickerSearch.value ? 'block' : 'none';
    renderPicker(pickerSearch.value);
  });
  pickerClearBtn.addEventListener('click', () => {
    pickerSearch.value = '';
    pickerClearBtn.style.display = 'none';
    renderPicker('');
    pickerSearch.focus();
  });
  pickerBackBtn.addEventListener('click', goBack);

  // ---------- Quick "add current song to a setlist" sheet (from reading view) ----------
  function renderQuickAdd(){
    if(currentSongIdx === null) return;
    const title = SONGS[currentSongIdx].title;
    quickAddSongTitle.textContent = 'Dodaj „' + title + '" do:';
    const lists = loadPlaylists();
    if(lists.length === 0){
      quickAddList.innerHTML = '<li style="padding:8px 4px; color:var(--muted); font-size:14px;">Nie masz jeszcze żadnej setlisty.</li>';
      return;
    }
    let html = '';
    lists.forEach(pl => {
      const inList = pl.songs.includes(title);
      html += '<li><button data-id="' + pl.id + '">'
        + '<span class="picker-check' + (inList?' checked':'') + '">' + (inList?'✓':'') + '</span>'
        + '<span>' + escapeHtml(pl.name) + '</span>'
        + '</button></li>';
    });
    quickAddList.innerHTML = html;
  }
  function openQuickAdd(){
    if(currentSongIdx === null) return;
    renderQuickAdd();
    openOverlay(quickAddBackdrop);
  }

  addToPlaylistBtn.addEventListener('click', openQuickAdd);
  quickAddBackdrop.addEventListener('click', e => {
    if(e.target === quickAddBackdrop) goBack();
  });
  quickAddList.addEventListener('click', e => {
    const btn = e.target.closest('button[data-id]');
    if(!btn || currentSongIdx === null) return;
    const title = SONGS[currentSongIdx].title;
    updatePlaylist(btn.dataset.id, pl => {
      const i = pl.songs.indexOf(title);
      if(i === -1) pl.songs.push(title); else pl.songs.splice(i,1);
    });
    renderQuickAdd();
  });
  quickAddNewBtn.addEventListener('click', async () => {
    if(currentSongIdx === null) return;
    const name = await customPrompt('Nazwa nowej setlisty:');
    if(!name || !name.trim()) return;
    const title = SONGS[currentSongIdx].title;
    const lists = loadPlaylists();
    lists.push({ id: genId(), name: name.trim(), songs: [title] });
    savePlaylists(lists);
    renderQuickAdd();
  });

  render('');

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
