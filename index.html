<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AdoNaj">
<title>Śpiewnik AdoNaj</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-190.png">
<link rel="apple-touch-icon" href="icons/icon-190.png">
<style>
  :root{
    --bg:#0f172a; --bg2:#1e293b; --card:#1e293b; --card2:#243247;
    --text:#f1f5f9; --muted:#94a3b8; --accent:#facc15; --accent2:#fbbf24;
    --border:#334155; --chord:#fbbf24;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;
  }
  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  /* ---------- Header ---------- */
  header{
    padding:calc(14px + var(--safe-top)) 16px 12px;
    background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:5;
  }
  header h1{
    margin:0 0 10px; font-size:20px; font-weight:700; letter-spacing:.2px;
    display:flex; align-items:center; gap:8px;
  }
  header h1 .dot{color:var(--accent);}
  .search-wrap{position:relative;}
  #search{
    width:100%; padding:11px 38px 11px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:16px; outline:none;
  }
  #search:focus{border-color:var(--accent);}
  .search-wrap .clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); font-size:20px; padding:6px; cursor:pointer; display:none;
  }
  .count{color:var(--muted); font-size:12px; margin-top:8px;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex; gap:6px; margin-bottom:10px;}
  .tab-btn{
    flex:1; padding:8px 10px; border-radius:10px; border:1px solid var(--border);
    background:var(--card2); color:var(--muted); font-size:14px; font-weight:600; cursor:pointer;
  }
  .tab-btn.active{background:var(--accent); color:#1e1b0a; border-color:var(--accent);}

  /* ---------- List ---------- */
  #list-view{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .letter-header{
    position:sticky; top:0; background:var(--bg); color:var(--accent);
    font-size:12px; font-weight:700; padding:6px 16px; letter-spacing:1px;
    border-bottom:1px solid var(--border);
  }
  ul.songs{list-style:none; margin:0; padding:0 0 calc(24px + var(--safe-bottom));}
  ul.songs li{
    border-bottom:1px solid var(--border);
  }
  ul.songs li button{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:14px 16px; font-size:16px; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer;
  }
  ul.songs li button:active{background:var(--card2);}
  ul.songs li button .chev{color:var(--muted); font-size:18px;}
  .empty{padding:40px 20px; text-align:center; color:var(--muted);}

  /* ---------- Playlists (setlisty) pane ---------- */
  #playlistsPane{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(24px + var(--safe-bottom));}
  .pl-toolbar{padding:4px 16px 14px;}
  .pl-new-btn{
    width:100%; padding:12px; border-radius:12px; border:1px dashed var(--accent);
    background:none; color:var(--accent); font-size:15px; font-weight:700; cursor:pointer;
  }
  .pl-new-btn:active{background:var(--card2);}
  ul.playlists{list-style:none; margin:0; padding:0;}
  ul.playlists li{
    display:flex; align-items:center; border-bottom:1px solid var(--border);
  }
  ul.playlists li button.pl-open{
    flex:1; text-align:left; background:none; border:none; color:var(--text);
    padding:14px 16px; font-size:16px; cursor:pointer; display:flex; flex-direction:column; gap:2px;
  }
  ul.playlists li button.pl-open:active{background:var(--card2);}
  ul.playlists li .pl-count{color:var(--muted); font-size:12px;}
  .pl-del{
    background:none; border:none; color:var(--muted); font-size:20px; padding:14px 16px; cursor:pointer;
  }
  .pl-del:active{color:#f87171;}

  /* ---------- Detail view ---------- */
  #detail-view{
    position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:10;
  }
  #detail-view.open{display:flex;}
  .detail-header{
    padding:calc(12px + var(--safe-top)) 8px 10px 8px;
    background:var(--bg2); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px;
  }
  .back-btn{
    background:none; border:none; color:var(--accent); font-size:16px; padding:8px 10px;
    display:flex; align-items:center; gap:4px; cursor:pointer; border-radius:8px;
  }
  .back-btn:active{background:var(--card2);}
  .detail-title{
    flex:1; font-size:16px; font-weight:700; padding-right:8px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .font-controls{display:flex; gap:4px;}
  .font-controls button{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:16px; cursor:pointer;
  }
  #song-body-wrap{flex:1; overflow:auto; -webkit-overflow-scrolling:touch;}
  pre#song-body{
    margin:0; padding:18px 16px calc(40px + var(--safe-bottom));
    font-family:"SF Mono", "Roboto Mono", Menlo, Consolas, "Courier New", monospace;
    font-size:15px; line-height:1.55; white-space:pre; overflow-x:auto;
    tab-size:4; -moz-tab-size:4;
  }
  /* chord-looking tokens (heuristic highlight) are wrapped server-side via span.chordline is not used;
     instead we color whole lines that look chord-only using a class added by JS */
  .chord-line{color:var(--chord); font-weight:700;}
  .ref-line{color:#38bdf8;}

  /* ---------- Add-to-setlist button (song reading header) ---------- */
  .pl-add-btn{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
    background:var(--card2); color:var(--accent); font-size:16px; cursor:pointer; margin-right:4px;
  }

  /* ---------- Playlist detail view ---------- */
  #playlist-detail-view, #playlist-picker-view{
    position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:10;
  }
  #playlist-detail-view.open, #playlist-picker-view.open{display:flex; z-index:11;}
  .pld-header-row{display:flex; align-items:center; gap:4px;}
  .pld-title-btn{
    flex:1; text-align:left; background:none; border:none; color:var(--text);
    font-size:16px; font-weight:700; padding:8px 4px; cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pld-icon-btn{
    background:none; border:none; color:var(--muted); font-size:18px; padding:8px; cursor:pointer;
  }
  .pld-icon-btn:active{color:var(--accent);}
  #playlistSongsContainer{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .pld-empty{padding:40px 20px; text-align:center; color:var(--muted);}
  ul.pld-songs{list-style:none; margin:0; padding:8px 0 calc(80px + var(--safe-bottom));}
  ul.pld-songs li{
    display:flex; align-items:center; gap:2px; border-bottom:1px solid var(--border); padding:0 8px;
  }
  ul.pld-songs li .pld-num{color:var(--muted); font-size:13px; width:22px; text-align:right; flex-shrink:0;}
  ul.pld-songs li button.pld-song-btn{
    flex:1; text-align:left; background:none; border:none; color:var(--text);
    padding:13px 8px; font-size:15px; cursor:pointer; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  ul.pld-songs li .pld-controls{display:flex; gap:2px; flex-shrink:0;}
  ul.pld-songs li .pld-controls button{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border);
    background:var(--card2); color:var(--muted); font-size:14px; cursor:pointer;
  }
  ul.pld-songs li .pld-controls button:disabled{opacity:.3;}
  ul.pld-songs li .pld-controls button.pld-remove{color:#f87171;}
  .pld-add-footer{
    position:sticky; bottom:0; padding:12px 16px calc(12px + var(--safe-bottom));
    background:linear-gradient(0deg,var(--bg) 60%, transparent); 
  }
  .pld-add-btn{
    width:100%; padding:12px; border-radius:12px; border:none;
    background:var(--accent); color:#1e1b0a; font-size:15px; font-weight:700; cursor:pointer;
  }

  /* ---------- Playlist picker (add songs) ---------- */
  #pickerListContainer{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  ul.picker-songs{list-style:none; margin:0; padding:0 0 calc(24px + var(--safe-bottom));}
  ul.picker-songs li button{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:14px 16px; font-size:16px; display:flex; align-items:center; gap:12px; cursor:pointer;
  }
  ul.picker-songs li button:active{background:var(--card2);}
  .picker-check{
    width:22px; height:22px; border-radius:6px; border:2px solid var(--border);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .picker-check.checked{background:var(--accent); border-color:var(--accent); color:#1e1b0a; font-weight:700;}

  /* ---------- Quick add-to-setlist modal (from song reading view) ---------- */
  #quickAddBackdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:20;
    align-items:flex-end; justify-content:center;
  }
  #quickAddBackdrop.open{display:flex;}
  #quickAddSheet{
    width:100%; max-width:480px; background:var(--bg2); border-radius:16px 16px 0 0;
    border:1px solid var(--border); border-bottom:none;
    padding:16px 16px calc(16px + var(--safe-bottom)); max-height:70vh; overflow-y:auto;
  }
  #quickAddSheet h3{margin:0 0 12px; font-size:15px; color:var(--muted); font-weight:700;}
  ul.quick-pl-list{list-style:none; margin:0 0 12px; padding:0;}
  ul.quick-pl-list li button{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:12px 4px; font-size:15px; display:flex; align-items:center; gap:12px; cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .quick-new-row{display:flex; gap:8px; margin-top:4px;}
  .quick-new-row button{
    padding:10px 14px; border-radius:10px; border:1px dashed var(--accent);
    background:none; color:var(--accent); font-size:14px; font-weight:700; cursor:pointer; width:100%;
  }
</style>
</head>
<body>
<div id="app">

  <div id="list-view">
    <header>
      <h1><span class="dot"><img src="icons/icon-192.png" alt="" style="height: 30px; vertical-align: middle;"></span> Śpiewnik AdoNaj</h1>
      <div class="tabs">
        <button class="tab-btn active" id="tabSongs" data-tab="songs">Pieśni</button>
        <button class="tab-btn" id="tabPlaylists" data-tab="playlists">Setlisty</button>
      </div>
      <div id="songsHeaderExtra">
        <div class="search-wrap">
          <input id="search" type="text" inputmode="search" placeholder="Szukaj tytułu pieśni…" autocomplete="off">
          <button class="clear" id="clearBtn" aria-label="Wyczyść">×</button>
        </div>
        <div class="count" id="count"></div>
      </div>
    </header>
    <div id="songsPane">
      <div id="listContainer"></div>
    </div>
    <div id="playlistsPane" style="display:none">
      <div class="pl-toolbar">
        <button class="pl-new-btn" id="newPlaylistBtn">+ Nowa setlista</button>
      </div>
      <div id="playlistsContainer"></div>
    </div>
  </div>

  <div id="detail-view">
    <div class="detail-header">
      <button class="back-btn" id="backBtn">‹ Wróć</button>
      <div class="detail-title" id="detailTitle"></div>
      <button class="pl-add-btn" id="addToPlaylistBtn" title="Dodaj do setlisty">♫+</button>
      <div class="font-controls">
        <button id="fontMinus">A-</button>
        <button id="fontPlus">A+</button>
      </div>
    </div>
    <div id="song-body-wrap">
      <pre id="song-body"></pre>
    </div>
  </div>

  <div id="playlist-detail-view">
    <div class="detail-header">
      <div class="pld-header-row" style="flex:1; min-width:0;">
        <button class="back-btn" id="pldBackBtn">‹ Wróć</button>
        <button class="pld-title-btn" id="pldTitleBtn"></button>
      </div>
      <button class="pld-icon-btn" id="pldDeleteBtn" title="Usuń setlistę">🗑</button>
    </div>
    <div id="playlistSongsContainer"></div>
    <div class="pld-add-footer">
      <button class="pld-add-btn" id="pldAddSongBtn">+ Dodaj pieśń</button>
    </div>
  </div>

  <div id="playlist-picker-view">
    <div class="detail-header">
      <button class="back-btn" id="pickerBackBtn">‹ Gotowe</button>
      <div class="detail-title" id="pickerTitle">Dodaj pieśni</div>
    </div>
    <div style="padding:12px 16px;">
      <div class="search-wrap">
        <input id="pickerSearch" type="text" inputmode="search" placeholder="Szukaj tytułu pieśni…" autocomplete="off">
        <button class="clear" id="pickerClearBtn" aria-label="Wyczyść">×</button>
      </div>
    </div>
    <div id="pickerListContainer"></div>
  </div>

  <div id="quickAddBackdrop">
    <div id="quickAddSheet">
      <h3 id="quickAddSongTitle"></h3>
      <ul class="quick-pl-list" id="quickAddList"></ul>
      <div class="quick-new-row">
        <button id="quickAddNewBtn">+ Nowa setlista z tą pieśnią</button>
      </div>
    </div>
  </div>

</div>

  function normalize(s){
    return s.toLowerCase()
      .replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l')
      .replace(/ń/g,'n').replace(/ó/g,'o').replace(/ś/g,'s').replace(/ź/g,'z').replace(/ż/g,'z');
  }

  const songsIndexed = SONGS.map((s,i) => ({...s, idx:i, norm: normalize(s.title)}));
  const titleToIdx = {};
  songsIndexed.forEach(s => { titleToIdx[s.title] = s.idx; });

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function render(filterText){
    const q = normalize(filterText || '');
    const filtered = q ? songsIndexed.filter(s => s.norm.includes(q)) : songsIndexed;

    countEl.textContent = filtered.length === songsIndexed.length
      ? (songsIndexed.length + ' pieśni')
      : ('Znaleziono: ' + filtered.length);

    if(filtered.length === 0){
      listContainer.innerHTML = '<div class="empty">Brak wyników dla podanej frazy.</div>';
      return;
    }

    let html = '';
    let lastLetter = null;
    let ul = '';
    filtered.forEach(s => {
      const letter = s.title.charAt(0).toUpperCase();
      if(letter !== lastLetter){
        if(ul){ html += '<ul class="songs">' + ul + '</ul>'; ul = ''; }
        html += '<div class="letter-header">' + letter + '</div>';
        lastLetter = letter;
      }
      ul += '<li><button data-idx="' + s.idx + '">' + escapeHtml(s.title) + '<span class="chev">›</span></button></li>';
    });
    if(ul){ html += '<ul class="songs">' + ul + '</ul>'; }
    listContainer.innerHTML = html;
  }

  // Heuristic: a line is a "chord line" if, once split on whitespace, every
  // token looks like a chord symbol. Supports both major (uppercase root,
  // e.g. G, C7, D/Fis) and Polish minor notation (lowercase root, e.g.
  // a, h, fis, cis, gis, dis, ais - the h/is/es forms used for minor chords
  // and sharps/flats in Polish chord charts), plus slash chords, sus/maj/
  // min/dim/aug/add qualifiers and numeric extensions (7, 9, sus4...).
  const CHORD_TOKEN = /^\(?(?:[A-H]|[a-h])(?:is|es|s)?(?:sus|maj|min|dim|aug|add|m)?[0-9]*[\+\-]?(?:\/(?:(?:[A-H]|[a-h])(?:is|es|s)?[0-9]*)?)?\)?$/;
  function isChordLine(line){
    const trimmed = line.trim();
    if(!trimmed) return false;
    const tokens = trimmed.split(/\s+/);
    if(tokens.length === 0) return false;
    let chordish = 0;
    tokens.forEach(t => { if(CHORD_TOKEN.test(t)) chordish++; });
    return chordish / tokens.length >= 0.8;
  }
  function isRefLine(line){
    return /^\s*(Ref\.?|Refren|REFREN|Bridge|BRIDGE|Coda)\b/i.test(line);
  }

  // ---------- Overlay stack: keeps every full-screen view / sheet in sync
  // with browser history so the hardware/software back button always closes
  // exactly the thing currently on top, however deep the user navigated. ----------
  const overlayStack = [];
  function openOverlay(el){
    el.classList.add('open');
    overlayStack.push(el);
    history.pushState({n: overlayStack.length}, '');
  }
  function closeTopOverlay(){
    const el = overlayStack.pop();
    if(el) el.classList.remove('open');
  }
  window.addEventListener('popstate', (e) => {
    const target = (e.state && e.state.n) || 0;
    while(overlayStack.length > target){ closeTopOverlay(); }
  });
  function goBack(){ history.back(); }

  // ---------- Song reading view ----------
  let currentSongIdx = null;
  function openSong(idx){
    currentSongIdx = idx;
    const s = SONGS[idx];
    detailTitle.textContent = s.title;
    const lines = s.body.split('\n');
    const frag = document.createDocumentFragment();
    songBody.innerHTML = '';
    lines.forEach((line, i) => {
      const span = document.createElement('span');
      if(isChordLine(line)) span.className = 'chord-line';
      else if(isRefLine(line)) span.className = 'ref-line';
      span.textContent = line;
      frag.appendChild(span);
      if(i < lines.length - 1) frag.appendChild(document.createTextNode('\n'));
    });
    songBody.appendChild(frag);
    document.getElementById('song-body-wrap').scrollTop = 0;
    openOverlay(detailView);
  }

    if(btn) openSong(parseInt(btn.dataset.idx,10));

  }

  // ---------- Playlists (setlisty) data layer ----------
  function loadPlaylists(){
    try {
      const raw = localStorage.getItem('spiewnik_playlists');
      return raw ? JSON.parse(raw) : [];
    } catch(e){ return []; }
  }
  function savePlaylists(list){
    try { localStorage.setItem('spiewnik_playlists', JSON.stringify(list)); } catch(e){}
  }
  function genId(){
    return 'pl_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function getPlaylist(id){
    return loadPlaylists().find(p => p.id === id) || null;
  }
  function updatePlaylist(id, mutateFn){
    const lists = loadPlaylists();
    const pl = lists.find(p => p.id === id);
    if(!pl) return;
    mutateFn(pl);
    savePlaylists(lists);
  }

  function renderPlaylists(){
    const lists = loadPlaylists();
    if(lists.length === 0){
      playlistsContainer.innerHTML = '<div class="empty">Brak setlist. Utwórz pierwszą powyżej.</div>';
      return;
    }
    let html = '<ul class="playlists">';
    lists.forEach(pl => {
      html += '<li>'
        + '<button class="pl-open" data-id="' + pl.id + '">'
        + '<span>' + escapeHtml(pl.name) + '</span>'
        + '<span class="pl-count">' + pl.songs.length + ' pieśni</span>'
        + '</button>'
        + '<button class="pl-del" data-id="' + pl.id + '">✕</button>'
        + '</li>';
    });
    html += '</ul>';
    playlistsContainer.innerHTML = html;
  }

    const q = normalize(filterText || '');
    const filtered = q ? songsIndexed.filter(s => s.norm.includes(q)) : songsIndexed;
    if(filtered.length === 0){
      pickerListContainer.innerHTML = '<div class="empty">Brak wyników.</div>';
      return;
    }
    let html = '<ul class="picker-songs">';
    filtered.forEach(s => {
      const inList = pl.songs.includes(s.title);
      html += '<li><button data-title="' + escapeHtml(s.title) + '">'
        + '<span class="picker-check' + (inList?' checked':'') + '">' + (inList?'✓':'') + '</span>'
        + '<span>' + escapeHtml(s.title) + '</span>'
        + '</button></li>';
    });
    html += '</ul>';
    pickerListContainer.innerHTML = html;
  }

  function openPicker(){
    pickerSearch.value = '';
    pickerClearBtn.style.display = 'none';
    renderPicker('');
    openOverlay(playlistPickerView);
  }

  pickerListContainer.addEventListener('click', e => {
    const btn = e.target.closest('button[data-title]');
    if(!btn) return;
    const title = btn.dataset.title;
    updatePlaylist(currentPlaylistId, pl => {
      const i = pl.songs.indexOf(title);
      if(i === -1) pl.songs.push(title); else pl.songs.splice(i,1);
    });
    renderPicker(pickerSearch.value);
    renderPlaylistSongs();
    renderPlaylistDetailHeader();
  });

  pickerSearch.addEventListener('input', () => {
    pickerClearBtn.style.display = pickerSearch.value ? 'block' : 'none';
    renderPicker(pickerSearch.value);
  });
  pickerClearBtn.addEventListener('click', () => {
    pickerSearch.value = '';
    pickerClearBtn.style.display = 'none';
    renderPicker('');
    pickerSearch.focus();
  });
  pickerBackBtn.addEventListener('click', goBack);

  // ---------- Quick "add current song to a setlist" sheet (from reading view) ----------
  function renderQuickAdd(){
    if(currentSongIdx === null) return;
    const title = SONGS[currentSongIdx].title;
    quickAddSongTitle.textContent = 'Dodaj „' + title + '" do:';
    const lists = loadPlaylists();
    if(lists.length === 0){
      quickAddList.innerHTML = '<li style="padding:8px 4px; color:var(--muted); font-size:14px;">Nie masz jeszcze żadnej setlisty.</li>';
      return;
    }
    let html = '';
    lists.forEach(pl => {
      const inList = pl.songs.includes(title);
      html += '<li><button data-id="' + pl.id + '">'
        + '<span class="picker-check' + (inList?' checked':'') + '">' + (inList?'✓':'') + '</span>'
        + '<span>' + escapeHtml(pl.name) + '</span>'
        + '</button></li>';
    });
    quickAddList.innerHTML = html;
  }
  function openQuickAdd(){
    if(currentSongIdx === null) return;
    renderQuickAdd();
    openOverlay(quickAddBackdrop);
  }

  addToPlaylistBtn.addEventListener('click', openQuickAdd);
  quickAddBackdrop.addEventListener('click', e => {
    if(e.target === quickAddBackdrop) goBack();
  });
  quickAddList.addEventListener('click', e => {
    const btn = e.target.closest('button[data-id]');
    if(!btn || currentSongIdx === null) return;
    const title = SONGS[currentSongIdx].title;
    updatePlaylist(btn.dataset.id, pl => {
      const i = pl.songs.indexOf(title);
      if(i === -1) pl.songs.push(title); else pl.songs.splice(i,1);
    });
    renderQuickAdd();
  });
  quickAddNewBtn.addEventListener('click', () => {
    if(currentSongIdx === null) return;
    const name = prompt('Nazwa nowej setlisty:');
    if(!name || !name.trim()) return;
    const title = SONGS[currentSongIdx].title;
    const lists = loadPlaylists();
    lists.push({ id: genId(), name: name.trim(), songs: [title] });
    savePlaylists(lists);
    renderQuickAdd();
  });

  render('');

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
