<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AdoNaj">
<title>Śpiewnik AdoNaj</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-190.png">
<link rel="apple-touch-icon" href="icons/icon-190.png">
<style>
  :root{
    --bg:#0f172a; --bg2:#1e293b; --card:#1e293b; --card2:#243247;
    --text:#f1f5f9; --muted:#94a3b8; --accent:#facc15; --accent2:#fbbf24;
    --border:#334155; --chord:#fbbf24;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;
  }
  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  /* ---------- Header ---------- */
  header{
    padding:calc(14px + var(--safe-top)) 16px 12px;
    background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:5;
  }
  header h1{
    margin:0 0 10px; font-size:20px; font-weight:700; letter-spacing:.2px;
    display:flex; align-items:center; gap:8px;
  }
  header h1 .dot{color:var(--accent);}
  .search-wrap{position:relative;}
  #search{
    width:100%; padding:11px 38px 11px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:16px; outline:none;
  }
  #search:focus{border-color:var(--accent);}
  .search-wrap .clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); font-size:20px; padding:6px; cursor:pointer; display:none;
  }
  .count{color:var(--muted); font-size:12px; margin-top:8px;}

  /* ---------- List ---------- */
  #list-view{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .letter-header{
    position:sticky; top:0; background:var(--bg); color:var(--accent);
    font-size:12px; font-weight:700; padding:6px 16px; letter-spacing:1px;
    border-bottom:1px solid var(--border);
  }
  ul.songs{list-style:none; margin:0; padding:0 0 calc(24px + var(--safe-bottom));}
  ul.songs li{
    border-bottom:1px solid var(--border);
  }
  ul.songs li button{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:14px 16px; font-size:16px; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer;
  }
  ul.songs li button:active{background:var(--card2);}
  ul.songs li button .chev{color:var(--muted); font-size:18px;}
  .empty{padding:40px 20px; text-align:center; color:var(--muted);}

  /* ---------- Detail view ---------- */
  #detail-view{
    position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:10;
  }
  #detail-view.open{display:flex;}
  .detail-header{
    padding:calc(12px + var(--safe-top)) 8px 10px 8px;
    background:var(--bg2); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px;
  }
  .back-btn{
    background:none; border:none; color:var(--accent); font-size:16px; padding:8px 10px;
    display:flex; align-items:center; gap:4px; cursor:pointer; border-radius:8px;
  }
  .back-btn:active{background:var(--card2);}
  .detail-title{
    flex:1; font-size:16px; font-weight:700; padding-right:8px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .font-controls{display:flex; gap:4px;}
  .font-controls button{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:16px; cursor:pointer;
  }
  #song-body-wrap{flex:1; overflow:auto; -webkit-overflow-scrolling:touch;}
  pre#song-body{
    margin:0; padding:18px 16px calc(40px + var(--safe-bottom));
    font-family:"SF Mono", "Roboto Mono", Menlo, Consolas, "Courier New", monospace;
    font-size:15px; line-height:1.55; white-space:pre; overflow-x:auto;
    tab-size:4; -moz-tab-size:4;
  }
  /* chord-looking tokens (heuristic highlight) are wrapped server-side via span.chordline is not used;
     instead we color whole lines that look chord-only using a class added by JS */
  .chord-line{color:var(--chord); font-weight:700;}
  .ref-line{color:#38bdf8;}
</style>
</head>
<body>
<div id="app">

  <div id="list-view">
    <header>
      <h1><span class="dot"><img src="icons/icon-190.png" alt="ikona" style="width: 20px; height: 20px;"></span> Śpiewnik AdoNaj</h1>
      <div class="search-wrap">
        <input id="search" type="text" inputmode="search" placeholder="Szukaj tytułu pieśni…" autocomplete="off">
        <button class="clear" id="clearBtn" aria-label="Wyczyść">×</button>
      </div>
      <div class="count" id="count"></div>
    </header>
    <div id="listContainer"></div>
  </div>

  <div id="detail-view">
    <div class="detail-header">
      <button class="back-btn" id="backBtn">‹ Wróć</button>
      <div class="detail-title" id="detailTitle"></div>
      <div class="font-controls">
        <button id="fontMinus">A-</button>
        <button id="fontPlus">A+</button>
      </div>
    </div>
    <div id="song-body-wrap">
      <pre id="song-body"></pre>
    </div>
  </div>

</div>

tę świętych\nG\nI święty Kościół Twój\nD\nWierzę w nasze zmartwychwstanie\nG\nGdy Jezus przyjdzie znów\nh\nWyznaję to\nG          A     D\nWierzę w imię Jezus\n\nRefren 1\nD\nTak, ja wierzę w Boga Ojca\nG\nW Syna, którym Jezus jest\nh\nWierzę też w Świętego Ducha\nG\nBóg jest w osobach trzech\nD\nWierzę także w zmartwychwstanie\nG\nŻe powstaniemy znów\nh\nWyznaję to\nG          A     D\nWierzę w imię Jezus"}, {"title": "Cóż Ci, Jezu, damy", "body": "1.\nD           e          A               D\nCóż Ci, Jezu, damy za Twych łask strumienie?\nD            e         A            D\nZ serca Ci składamy korne dziękczynienie.\n\nRefren:\nD           e        A          D\nPanie nasz, króluj nam! Boże nasz, króluj nam!\nD             e          A           D\nPoprzez wieczny czas króluj, Jezu, nam!\n\n2.\nD           e            A            D\nW Serca Twego ranie, o serc naszych Królu,\nD           e        A          D\npokój i wytrwanie, ukojenie w bólu.\n\nRefren:\nD           e        A          D\nPanie nasz, króluj nam! Boże nasz, króluj nam!\nD             e          A           D\nPoprzez wieczny czas króluj, Jezu, nam!\n\n3.\nD           e            A            D\nTy nas wspieraj w znoju, strzeż przez życie całe,\nD           e            A            D\nbyśmy w serc pokoju Twą wielbili chwałę.\n\nRefren:\nD           e        A          D\nPanie nasz, króluj nam! Boże nasz, króluj nam!\nD             e          A           D\nPoprzez wieczny czas króluj, Jezu, nam!\nRef."}, {"title": "Daj mi usłyszeć Twój głos", "body": "1. Daj mi usłyszeć Twój głos, rozpoznać go.\nDaj mi wybierać Twe słowa pośród tysiąca słów.\nDaj mi zobaczyć Twą twarz, zatrzymać wzrok.\nPokój znajduję w Tobie, gdy widzę Ciebie blisko.\nRef. Jezus... x4\n2. Daj mi łaskę Twą, bym nie bał się.\nDaj mi uwierzyć, że mogę czynić cuda w Twoje Imię.\nCoda: Postaw mnie mocno na skale.\nUmocnij mnie, wybieram Cię na zawsze.\nGdybyś mówił językami świata tego,\nnie znał granic,\nWiedzę jego posiadł pełną,\nnic nie będziesz miał.\nTo, co widzisz i co słyszysz, co smakujesz i co liczysz,\nCo posiadasz, to posiada cię.\nA ja kocham cię, mówi Pan.\nNaprawdę kocham cię, na wieki kocham cię.\nMiłość czeka, nie zawodzi,\nKiedy zdradzisz – nie odchodzę.\nMiłość nigdy nie ustaje, trwa.\nJestem w tobie, zawsze byłem,\nCzekam dzisiaj - każdą chwilę z tobą spędzić,\nŻycie twoje, chcę.\nBo ja kocham cię, mówi Pan.\nNaprawdę kocham cię, na wieki kocham cię.\nAkordy:\nzwr. i ref. G D e C/D\nbridge: a h C a h C/D\nGdybyś mówił...\nG D e C/D"}, {"title": "Duchu Święty rozpalaj serce me", "body": "\tGuadalupe\n\ne C D e\n1.Duchu Święty rozpalaj serce me   // x 4\n\nC D e\nRef. Chcemy Cię uwielbiać, chwalić Ciebie Panie\nBo Ty jesteś światłem co nigdy nie gaśnie!\n\n2. Duchu Święty oświecaj serce me // x 4\n3. Duchu Święty uwalniaj serce me // x 4\n4. Duchu Święty uzdrawiaj, umacniaj, ochraniaj, oczyszczaj.....\n5. Duchu Święty rozraduj serce me"}, {"title": "Duchu Święty, przyjdź", "body": "D G D\nDuchu Święty przyjdź.\nD G A\nDuchu Święty przyjdź. /x2\n\nG D\nNiech wiara zagości,\nG D\nNadzieja zagości,\nG D A\nNiech miłość zagości w nas"}, {"title": "Duszo ma, Pana chwal", "body": "G D A h\nRef. Duszo ma, Pana chwal, oddaj Bogu cześć,\nG D A\nŚwiętemu śpiewaj pieśń.\nG h G A h\nZ mocą wywyższaj go, duszo ma,\nG A D\nUwielbiam Boże, Cię.\n\nG D A h\n1.Nowy dzień wraz ze wschodem słońca,\nG D A h\nZnów nadszedł czas, by Ci śpiewać pieśń.\nG D A h\nCokolwiek jest już za mną i to wszystko co przede mną\nG D A D\nWiem, będę śpiewać, gdy nadejdzie zmrok.\n\n\tRef. Duszo ma..\n\nG D A h\n2.Bogaty w miłość gniew oddalasz Panie\nG D A h\nTwe serce miłe wielbię imię Twe\nG D A h\nZe względu na Twą dobroć będę śpiewać Tobie pieśni\nG D A D\nWiele powodów by uwielbiać Cię\n\n\tRef. Duszo ma...\n\nG D A h\n3.Przyjdzie dzień gdy bez sił zostanę\nG D A h\nNadejdzie czas mego końca tu\nG D A h\nDusza ma będzie już na zawsze Cię uwielbiać\nG D A D\nW wieczności z Tobą piękna zabrzmi pieśń\n\tRef. Duszo ma…"}, {"title": "Dzięki za Twój Krzyż", "body": "D A h\nDzięki za Twój Krzyż,\nG D A\ndzięki za zwycięstwo Twe,\nD A h\ndzięki, że Twa krew oczyszcza mnie,\nG A D\ndzięki za miłosierdzie Twe."}, {"title": "Hymn o krzyżu", "body": "d A7 d\n1.Krzyżu święty, co świat obejmujesz,\nF C F A7\nKtóry rozdartą ziemię ramionami dwoma,\nd C g d\nJak dziecko słabe matka, przed ciemnością bronisz,\ng A7 d\nZmiłuj się nad nami!\nd A7 d\nKrzyżu święty, masz moc pojednania\nF C F A7\nI Północy z Południem, i Wschodu z Zachodem,\nd C g d\nKtóry nienawiść łamiesz, a niewolę kruszysz,\ng A7 d\nZmiłuj się nad nami!\n\nd A d F C F F7\nRef. Tobą mury rozwalać, Tobą się osłonić,\nB F C B F C A7||A7 d\nTobie się ufnym sercem z miłością pokłonić. /2x\n\n2.\nd             A7           d\nKrzyżu święty, który ziemię spinasz,\nF               C             F                A7\nJak, gdy żelazną klamrą człowiek dom swój chroni,\nd             C              g              d\nBy się w gruzy nie rozpadł na zwęglonej ziemi,\ng         A7  d\nZmiłuj się nad nami!\n\nd             A7            d\nKrzyżu święty nad nami wzniesiony,\nF          C          F            A7\nJak bandaż litościwie ściągasz brzegi rany,\nd            C           g               d\nBy się nowe zaczęło w sercu wyleczonym,\ng         A7  d\nZmiłuj się nad nami!\n\nRef.\nd    A       d        F    C     F   F7\nTobą mury rozwalać, Tobą się osłonić,\nB        F     C     B        F     C  A7  d\nTobie się ufnym sercem z miłością pokłonić. /2x"}, {"title": "Jakie piękne jest Imię Twe", "body": "Zwrotka 1\nD \nTy na początku byłeś Słowem \nG h A\ntam, gdzie sam Najwyższy Pan   \nh A D\nSwą chwałę ukrył w tym co stworzył  \nG h A\nLecz objawił Ciebie nam   \n\nRefren\nD A\nJakie piękne jest Imię Twe  \nJakie piękne jest Imię Twe\nh A G\nTwe Imię, Jezu, Królu nasz\nD A\nJakie piękne jest Imię Twe, \nnic z nim nie równa się\nh A G\nJakie piękne jest Imię Twe, \nTwe Imię Jezu\n\nZwrotka 2\nD\nNie chciałeś mieszkać w niebie ny, Jezus złamał śmierci moc\nd g\nJezus jest Panem, o Alleluja\nA d\nPo wieczne czasy Królem Królów jest\nd || g || C\nJezus jest Panem x3\nF A\nJezus jest Panem\nd\nTylko Jezus jest Panem\ng\nJezus jest Panem\nA d\nOn jest Panem ziemi tej\n\nd g A d\nAlleluja, Alleluja, Alleluja, Alleluja x2"}, {"title": "Każdy spragniony", "body": "C e\nKażdy spragniony i słaby dziś\nF\nNiech przyjdzie do źródła\nd e F\nW Wodzie Życia zanurzy się\nC e\nBól i cierpienie niech odpłyną w dal\nF d e F\nW morzu miłości serca uleczy dzisiaj Pan\nC F\nPanie Jezu, przyjdź  x4"}, {"title": "Matko o twarzy jak polska ziemia czarnej", "body": "d g\nRef. Matko, o twarzy jak polska ziemia czarnej,\nC F A\nMatko, o twarzy jak polska ziemia znaczonej bliznami,\nd g\nDo serca swego jak Syna nas przygarnij.\nC F A || A d\nKrólowo nasza, Tarczo Obronna, módl się za nami.\n\nd a F g\n1. Próżno niejeden wróg wkładał zbroję,\nC [F g] d A\nby dzieci Twoje zniewolić, Ojczyznę zabrać im.\nd a F g C F g\nTy, choć bez zbroi i bez oręża, zawsze zwyciężasz,\nd A\nBy wskazać, że pokój daje Syn.\n\nd a F g\n2. Próżno pragnęli z serc Cię wyrzucić,\nC [F g] d A\nPokój zakłócić, odebrać nadzieję, wiary znak,\nd a F g C F g\nBo kto Cię, Matko, kochać nie umie, ten nie zrozumie,\nd A\nDlaczego przy Tobie trwamy tak.\n\nd a F g\n3. Dziś wróg z ukrycia i bez pancerza.\nC [F g] d A\nW serca uderza, nie pozwól, by zniszczył Boga w nas.\nd a F g C F g\nMatko, błagamy, w czas niespokojny\nd A\nBroń nas od wojny, wierzymy - zwyciężysz jeszcze raz."}, {"title": "Matko, która nas znasz", "body": "e C\nRef. Matko, która nas znasz,\nD e\nZ dziećmi Twymi bądź,\ne G D\nNa drogach nam nadzieją świeć,\ne D7 e D e\nZ Synem Twym z nami idź.\n\n1.\nG                   e\nZ wszystkich niewiast wybrana,\ne        D     e\nPrzyjdź i drogę wskaż.\nG           e\nCórko Ludu Bożego,\na          H7\nDo Syna Twego nas prowadź.\ne          C\nSłużebnico pokorna,\na      H7    e  D\nPokój światu daj.\n\ne C\nRef. Matko, która nas znasz,\nD e\nZ dziećmi Twymi bądź,\ne G D\nNa drogach nam nadzieją świeć,\ne D7 e D e\nZ Synem Twym z nami idź.\n\n2.\nG                   e\nKrólowo ognisk rodzinnych,\ne        D     e\nPrzyjdź i drogę wskaż.\nG              e\nDziewico, wzorze prostoty,\na          H7\nDo Syna Twego nas prowadź.\ne          C\nOblubienico cieśli,\na      H7    e  D\nPokój światu daj.\n\ne C\nRef. Matko, która nas znasz,\nD e\nZ dziećmi Twymi bądź,\ne G D\nNa drogach nam nadzieją świeć,\ne D7 e D e\nZ Synem Twym z nami idź.\n\n3.\nG                 e\nKrólowo narodu naszego,\ne        D     e\nPrzyjdź i drogę wskaż.\nG             e\nUciśnionych nadziejo,\na          H7\nDo Syna Twego nas prowadź.\ne                 C\nŚwiatło łaknących prawdy,\na      H7    e  D\nPokój światu daj.\n\ne C\nRef. Matko, która nas znasz,\nD e\nZ dziećmi Twymi bądź,\ne G D\nNa drogach nam nadzieją świeć,\ne D7 e D e\nZ Synem Twym z nami idź.\n\n4.\nG                   e\nPociecho ludu biednego,\ne        D     e\nPrzyjdź i drogę wskaż.\nG                 e\nPani wszelkiej radości,\na          H7\nDo Syna Twego nas prowadź.\ne             C\nMatko tkliwego serca,\na      H7    e  D\nPokój światu daj.\n\ne C\nRef. Matko, która nas znasz,\nD e\nZ dziećmi Twymi bądź,\ne G D\nNa drogach nam nadzieją świeć,\ne D7 e D e\nZ Synem Twym z nami idź.\n\n5.\nG                     e\nMatko przez Syna nam dana,\ne        D     e\nPrzyjdź i drogę wskaż.\nG                    e\nMatko, która nas słuchasz,\na          H7\nDo Syna Twego nas prowadź.\ne               C\nTy nas zawsze rozumiesz,\na      H7    e  D\nPokój światu daj.\n\ne C\nRef. Matko, która nas znasz,\nD e\nZ dziećmi Twymi bądź,\ne G D\nNa drogach nam nadzieją świeć,\ne D7 e D e\nZ Synem Twym z nami idź.\n\n6.\nG                     e\nDziewico, Matko Chrystusa,\ne        D     e\nPrzyjdź i drogę wskaż.\nG                    e\nDziewico, Matko Kościoła,\na          H7\nDo Syna Twego nas prowadź.\ne                 C\nDziewico, Matko ludzi,\na      H7    e  D\nPokój światu daj.\n\ne C\nRef. Matko, która nas znasz,\nD e\nZ dziećmi Twymi bądź,\ne G D\nNa drogach nam nadzieją świeć,\ne D7 e D e\nZ Synem Twym z nami idź.\n\n7.\nG                     e\nDziewico z nami idąca,\ne        D     e\nPrzyjdź i drogę wskaż.\nG                     e\nHistorii świata promieniu,\na          H7\nDo Syna Twego nas prowadź.\ne             C\nPośredniczko najlepsza,\na      H7    e  D\nPokój światu daj."}, {"title": "Misericordias Domini", "body": "d A d C\nMisericordias Domini,\nF C d A d\nin aeternum cantabo."}, {"title": "Mów do mnie Panie", "body": "h A h fis\nMów do mnie Panie, chcę słyszeć Cię,\nh A G\nPrzyjąć od Ciebie, co masz dla mnie.\nh A h fis\nNie chcę się chować, lecz w Tobie skryć.\nh A G A\nW cieniu Twym, Panie, chcę iść.\nh G A h\nŚwięty, potężny jesteś, Panie nasz,\nG A h\nPrzed Tobą dziś możemy stać,\nG h A\nDzięki łasce, nie dzięki nam samym."}, {"title": "Nasz Bóg jest potężny", "body": "C G D e C\nNasz Bóg jest potężny w mocy swej, króluje nad nami dziś\nG a h e\nZ nieba rządzi w mocy, miłości, mądrości swej."}, {"title": "Nasz Bóg jest wielki", "body": "cis A E\nWodę zamieniłeś w wino\ncis A E fis H\nŚlepi przy Tobie znów widzą, któż jest jak Ty? Tylko Ty?\ncis A E\nBlaskiem rozświetlasz ciemności\ncis A E fis H\nCzłowiek powstaje z marności, któż jest jak Ty? Tylko Ty?\n\ncis A\nRef. Nasz Bóg jest wielki, nasz Bóg jest silny\nE H\nBoże nikt inny nie równa się z Tobą.\nNasz Bóg uzdrawia, jest wszechmogący.\nNasz Bóg, Nasz Bóg.  X2\n\ncis A E\nBlaskiem rozświetlasz ciemności\ncis A E fis H\nCzłowiek powstaje z marności, któż jest jak Ty? Tylko Ty?\n\nRef x2\ncis A\nNasz Bóg jest wielki, nasz Bóg jest silny\nE H\nBoże nikt inny nie równa się z Tobą.\nNasz Bóg uzdrawia, jest wszechmogący.\nNasz Bóg, Nasz Bóg.  X2\n\ncis A\nJeśli nasz Bóg jest przy nas już nic nas nie zatrzyma!\nE H\nJeśli nasz Bóg jest z nami, któż jest przeciwko nam?\nx2\n\ncis A\nRef. Nasz Bóg jest wielki, nasz Bóg jest silny\nE H\nBoże nikt inny nie równa się z Tobą.\nNasz Bóg uzdrawia, jest wszechmogący.\nNasz Bóg, Nasz Bóg.  X2"}, {"title": "Nic nie musisz mówić nic", "body": "e C\nNic nie musisz mówić nic\nD\nOdpocznij we mnie\nG H7\nCzuj się bezpiecznie\ne C\nPozwól kochać się\nD G H7\nMiłość pragnie Ciebie"}, {"title": "Nie mądrość świata tego (Marana tha!)", "body": "d || C                                F || G\nMarana tha, marana tha! /x4\n\nd F\nref.: Nie mądrość świata tego\nC g d\nLecz Pana ukrzyżowanego\nF C G\nGłosimy aż przyjdzie znów /x2\n\nd F\n1. Bo Chrystus Jezus skałą serca mego\nC G d\nOdsunął kamień, serce z ciała dał mi swego\nF\nBy nas na nowo zrodzić – wstąpił w niebo\nC G\nAby świętego Ducha zesłać nam dlatego\n\nd F\nref.: Nie mądrość świata tego\nC g d\nLecz Pana ukrzyżowanego\nF C G\nGłosimy aż przyjdzie znów /x2\n\nd F\n2. Zbawienie swoje z wiarą spożywajcie\nC G d\nZrodzeni w ogniu z Ducha życiem rozgłaszajcie\nF\nŻe tego któregośmy krzyżowali\nC G\nBóg wezwał z martwych i do swojej chwały, wziął stąd\n\nd F\nref.: Nie mądrość świata tego\nC g d\nLecz Pana ukrzyżowanego\nF C G\nGłosimy aż przyjdzie znów /x2\n\nd F\n    3. Idźcie i głoście Syna Boga Panem\nC G d\nKrwią Jego imię wasze w niebie zapisane\nF\nW Jego miłości wszystkich zanurzajcie\nC G\nKrólestwa Jego – niechaj przyjdzie – przyzywajcie!\n\nd || C                                F || G\nMarana tha, marana tha! /x4\n\nref.: d F\nref.: Nie mądrość świata tego\nC g d\nLecz Pana ukrzyżowanego\nF C G\nGłosimy aż przyjdzie znów /x2"}, {"title": "Niechaj zstąpi Duch Twój i odnowi ziemię", "body": "e\nNiechaj zstąpi Duch Twój i odnowi ziemię\nC\nŻyciodajny spłynie deszcz na spragnione serce,\na h\nObmyj mnie i uświęć mnie;\nUwielbienia niech popłynie pieśń!  x2\t\t\t\te CH7\nC G\nChwała Jezusowi, który za mnie życie dał!\nC G\nChwała Temu, który pierwszy umiłował mnie.\nC h e\nJezus! Tylko Jezus Panem jest!"}, {"title": "Niepojęty, Niezmierzony", "body": "a G C\n1.\tZ głębokości mórz aż po szczyty gór\nd C B\nStworzenie objawia Majestat Twój\na G C\nOd kolorów jesieni po wiosenny nów\nd C B\nWszystko śpiewa Ci pieśń pełną cudownych słów\nF G\nogłaszając\nC G\nNiepojęty, niezmierzony\nF\ngwiazdy stworzyłeś na niebie\na\ni każdą z nich znasz\nG F\nWspaniałym Bogiem Tyś jest\nC G\nWszechmogący nieskończony\nF\nW zachwycie klękamy przed Tobą\na\nBy wyznać to że\nG F\nwspaniałym Bogiem Tyś jest\na G C\n2. Kto uwalnia błyskawic moc w czasie burz\nd C B\nKto maluje kolory porannych zórz\na G C\nSłońce stworzył na niebie i dał mu Swą moc\nd C B\nOrzeźwienie przynosi w gwieździstą noc\nF G\nTylko Ty\nC G\nNiepojęty, niezmierzony\nF\nGwiazdy stworzyłeś na niebie\na\nI każdą z nich znasz\nG F\nWspaniałym Bogiem Tyś jest\nC G\nZawsze dobry miłujący\nF\nTy znasz moje serce i mimo to\na\nWciąż kochasz mnie\nG F C\nWspaniałym Bogiem Tyś jest\t(+instr + ref.2)"}, {"title": "Nikt Cię nie kocha tak jak Ja (Guadalupe)", "body": "F C d\n1. Ile czekałem na tą chwilę\nB C\nIle czekałem byś zechciał przyjąć Mnie\nF C d\nIle czekałem, byś się odezwał\nB C\nByś w me ramiona w końcu wtulił się\n\nF C d\nJa wiem dobrze, co przeżywasz\nB C\nWiem też dobrze, czemu płaczesz\nF C d\nI znam dobrze Twe cierpienie\nB C\nBo nigdy nie opuściłem Ciebie\n\nF C d\nRef. Nikt Cię nie kocha tak jak Ja\nB C\nNikt Cię nie kocha tak jak Ja\nF C d\nPopatrz na krzyż oto dowód mej miłości\nB C\nNikt Cię nie kocha tak jak Ja\n\nF C d\nNikt Cię nie kocha tak jak Ja\nB C\nNikt Cię nie kocha tak jak Ja\nF C d\nPopatrz na krzyż, to dla Ciebie, bo Cię kocham!\nB C F\nNikt Cię nie kocha tak jak Ja\n\nF C d\n2. Ja wiem, co chcesz Mi powiedzieć\nB C\nChociaż czasem nic nie mówisz\nF C d\nWiem też dobrze to, co czujesz\nB C\nChoć tym ze Mną się nie dzielisz\n\nF C d\nPrzy Twym boku wciąż kroczyłem\nB C\nW trudnych chwilach niosłem Ciebie\nF C d\nWiedz, że robię to, bo Jestem\nB C\nTwym najlepszym przyjacielem!"}, {"title": "Oceany", "body": "h fis D\nZnad oceanów do mnie wołasz\nA G A\nGdzie każdy krok niepewny jest\nh fis D\nTy jesteś tam, gdzie niewiadoma\nA G\nTam znajdę grunt dla wiary mej\nG D A\nI będę wzywać imię Twe\nG D A\nI ponad fale patrzeć chcę\nG\nGdy burzą się\nD A\nDla duszy pokój w Tobie jest\nG A\nGdzie pójdziesz Ty\nh fis D A G (A)\nJa pójdę też\n\nh fis D\nMój strach utonie w Twojej łasce\nA G A\nBo ręka Twa prowadzi mnie\nh fis D\nI Ty mnie nigdy nie zawiodłeś\nA G\nWiem, teraz też nie zawiedziesz mnie\nG D A\nI będę wzywać imię Twe\nG D A\nI ponad fale patrzeć chcę\nG\nGdy burzą się\nD A\nDla duszy pokój w Tobie jest\nG A\nGdzie pójdziesz Ty\nh\nJa pójdę też\n\nh\nDuchu prowadź mnie\nD\nGdzie wiara nie ma granic\nA\nDaj mi chodzić nad wodami\nG\nGdziekolwiek mnie zabierzesz\nh\nProwadź głębiej niż\nD\nPójść mogą moje stopy\nA\nMoja wiara się umocni\nG\nW Twojej obecności \t\t{Bridge}x3\n\nG D A\nI będę wzywać imię Twe\nG D A\nI ponad fale patrzeć chcę\nG\nGdy burzą się\nD A\nDla duszy pokój w Tobie jest\nG A\nGdzie pójdziesz Ty\nh fis D A G (A)\nJa pójdę też"}, {"title": "Pan Bóg Izraela", "body": "| Am | F | C |\n Nowe słońce wzejdzie nam\nZ domu Dawida zbawczy blask\nZniknie mrok i śmierci cień\nNadejdzie Pana wielki dzień\n\n| Am | F | C |\nPrzedziwny doradca \n| Am | F | C |\nBóg mocny, Odwieczny ojciec \n| Am | F | C | Em/H |\nKsiążę pokoju \n| Am | F | C |\nWielkie będzie Jego panowanie \n| Am | F | C |\nW pokoju bez granic \n\n| Am | F7+ | C | G |\nBłogosławiony Pan Bóg Izraela\nStworzenie wiecznie będzie Tobie śpiewać\nBłogosławiony Pan Bóg Izraela\nWraz z aniołami wywyższamy króla Nieba\n\n| Am |\nAlfa, Omega \n| F |\nPierwszy i ostatni \n| C | Em/H |\nPoczątek i koniec \n| Am | F |\nNadeszło zbawienie, potęga i panowanie\n| C | Em |\nLwa z rodu Judy \n\nAm | F7+ | C | G |\nBłogosławiony Pan Bóg Izraela\nStworzenie wiecznie będzie Tobie śpiewać\nBłogosławiony Pan Bóg Izraela\nWraz z aniołami wywyższamy króla Nieba\n\nHosanna \t\t| Am | G/H | C |\nSynowi Dawida \t| F6 |\nHosanna \t\t| Am | G/H | C |\n\n | Am | F | C |\nNowe słońce wzeszło nam\nZ domu Dawida zbawczy blask\nZniknął mrok i śmierci cień\nNadejdzie Pana wielki dzień"}, {"title": "Pan jest mocą swojego ludu", "body": "F B C\n  dC\nPan jest mocą swojego ludu.\nF C\nPieśnią moją jest Pan.\nB A d\nMoja tarcza i moja moc.\nC F B C\nOn jest mym Bogiem, nie jestem sam,\na d B C F (dC)\nW Nim moja siła, nie jestem sam."}, {"title": "Pan wywyższony, nasz Król wywyższony", "body": "E cis A\nPan wywyższony, nasz Król wywyższony wśród chwał,\nfis H\nUwielbiajmy Go.\nE cis A H Cis\nPan wywyższony nasz Król wywyższony, oddajmy Jemu cześć\nfis H E cis\nKrólem jest Pan, ta prawda na wieki trwa.\nfis H E gis A H\nNiech cały świat raduje się Jego imieniem:\nA fis H E\nPan wywyższony, nasz Król wywyższony wśród chwał."}, {"title": "Panie, dobry jak chleb", "body": "C F G\nRef. Panie, dobry jak chleb,\na F G\nBądź uwielbiony od swego Kościoła,\nC e F C\nBo Tyś do końca nas umiłował,\nd G C\nDo końca nas umiłował.\n\nd G d\n1. Tyś na pustkowiu chleb rozmnożył, Panie,\nG D G\nByśmy do nieba w drodze nie ustali,\na G C\nTyś stał się manną wędrowców przez ziemię,\nG C G\nDla tych, co dotąd przy Tobie wytrwali.\n\n2.\nd               G         d\nZiarna zbierzemy, odrzucimy chwasty,\nG        D               G\nBo łan dojrzewa, pachnie świeżym chlebem,\na            G          C\nNiech ziemia nas stanie się ołtarzem,\nG       C                      G\nA chleb komunią dla spragnionych Ciebie.\n\n3.\nd               G             d\nTy nas nazwałeś swymi przyjaciółmi,\nG               D             G\nJeśli spełnimy, co nam przykazałeś.\na          G            C\nCóż my bez Ciebie, Panie, uczynimy?\nG           C                G\nTyś naszym życiem i oczekiwaniem.\n\n4.\nd               G           d\nTyś za nas życie swe oddał na krzyżu,\nG             D              G\nA w znaku chleba w świątyniach zostałeś,\na           G          C\nI dla nas zawsze masz otwarte serce,\nG        C               G\nBo Ty do końca nas umiłowałeś."}, {"title": "Panie, pragnienia ludzkich serc", "body": "C e F C F e\nRef. Panie, pragnienia ludzkich serc Ty zaspokoisz sam.\na e\nPrzyjdź, Chlebie Żywy, Zbawco nasz,\nd7 G C\nPszeniczny Darze, przyjdź.\n\nC a F e a\n1.Jak pasterz woła owce swe i znają Jego głos,\nd G d G\nTak wzywasz nas, rodzinę swą, za Tobą chcemy iść.\n\nC a F e a\n2.Z radością więc śpiewamy Ci ten dziękczynienia hymn.\nd G d G\nGodnymi czynisz dzisiaj nas niebieski dzielić chleb.\n\nC a F e a\n3.Ty, Panie, dajesz siebie nam, by naszym życiem być,\nd G d G\nJak braciom służyć, naucz, jak miłością, prawdą żyć."}, {"title": "Pasja miłości (Beata Bednarz)", "body": "capo 1\n\n\t1.\nh          A   h\nWzgardzony był On\nh         A     h\nPrzygięty cierpieniem\nh         A        G   h\nZraniony i niewinny tak\nh          A      h\nNiósł ciężar i wstyd\nh           A      h\nNiósł grzechy i winy\nh          A        G          h\nChorobę, ból i nasz strach\n\ne           fis\nKażdy grzech\nh         A\nNa krzyżu spłacił\ne        fis\nSwoją krwią\n\nRef.\nD             A\nOn zdradzony jak nikt\nh\nZraniony jak nikt\nA\nMiał za nas tam iść\nD\nZ miłością niosąc krzyż\nA\nKto może pojąć dziś\nh\nJak wielki był to ból\nA\nZa ciebie za mnie szedł\nA     (h)\nJezus mój\n\n2.\nh         A      h\nZa ciebie i mnie\nh          A       h\nNa krzyża ramionach\nh            A          G       h\nRozpięty był On, Pan i Król\nh           A    h\nCzłowiekiem się stał\nh           A      h\nI jak człowiek skonał\nh            A          G           h\nZ miłością zniósł strach i ból\n\ne           fis\nKażdy grzech\nh         A\nNa krzyżu spłacił\ne        fis\nSwoją krwią\n\nRef.\n             D\nCzy wierzysz, że\n              A\nOn zdradzony jak nikt\nh\nZraniony jak nikt\nA\nMiał siłę aby iść\nD\nZ miłością niosąc krzyż\nA\nKto może pojąć dziś\nh\nJak wielki był to cud\nA                  (h)\nBarankiem stał się Bóg\n\nD             A\nOn zdradzony jak nikt\nh\nZraniony jak nikt\nA\nMiał siłę aby iść\nD\nZ miłością niosąc krzyż\nA\nKto może pojąć dziś\nh\nJak wielki był to cud\nA\nBarankiem stał się Bóg\nA     h\nJezus mój"}, {"title": "Poddaję wszystko Tobie", "body": "G D a C\n1. Dzisiaj składam u Twych stóp\nWłasną dumę, własny trud\nPoddaję wszystko Tobie\nPoddaję wszystko Tobie\nDzisiaj składam u Twych stóp\nKażde kłamstwo, każdy ból\nPoddaję wszystko Tobie\n\nREFREN\nG D a C\nPrzyjmij dziś to, co mam\nOddaję Ci moją przestrzeń\nMożesz czynić, co zechcesz  x4\n\nG D a C\n2. Życie składam u Twych stóp\nTwoją drogą pragnę pójść\nPoddaję wszystko Tobie\nPoddaję wszystko Tobie\nŻycie składam u Twych stóp\nTwoją drogą pragnę pójść\nPoddaję wszystko Tobie.\n\nRef. x4"}, {"title": "Podnieś mnie, Jezu", "body": "d B C a\n Podnieś mnie, Jezu, i prowadź do Ojca.\nd B C a\n Podnieś mnie, Jezu, i prowadź do Ojca.\nF C a\n  Zanurz mnie w wodzie Jego miłosierdzia.\nd C a d\nAmen /x3"}, {"title": "Pokładam w Panu ufność mą", "body": "Ref.\nfis        h          E              fis\nPokładam w Panu ufność mą, zawsze ufam Jego słowu.\n\n1.\nfis                    cis\nZ głębokości wznoszę głos do Ciebie,\ncis                   fis\nracz wysłuchać, Panie prośby mej.\nD                     fis\nnakłoń ku mnie ucho Twe łaskawie,\ncis               fis\nusłysz modły i błagania.\n\nRef.\nfis        h          E              fis\nPokładam w Panu ufność mą, zawsze ufam Jego słowu.\n\n2.\nfis                      cis\nJeśli grzechów nie zapomnisz, Panie,\ncis                    fis\nKtóż przed gniewem Twym ostoi się?\nD                         fis\nLecz ufamy, że przebaczysz winy,\ncis               fis\nByśmy kornie Ci służyli.\n\nRef.\nfis        h          E              fis\nPokładam w Panu ufność mą, zawsze ufam Jego słowu.\n\n3.\nfis                   cis\nCałą ufność mą pokładam w Panu,\ncis                 fis\nDusza moja ufa Jego słowu,\nD                         fis\nTęskniej czeka dusza moja Pana,\ncis                  fis\nNiż jutrzenki nocne straże.\n\nRef.\nfis        h          E              fis\nPokładam w Panu ufność mą, zawsze ufam Jego słowu.\n\n4.\nfis                        cis\nTęskniej niż jutrzenki nocne straże\ncis                  fis\nNiechaj Pana czeka Boży lud,\nD                         fis\nBo u Pana znajdzie zmiłowanie\ncis                fis\nI obfite odkupienie.\n\nRef.\nfis        h          E              fis\nPokładam w Panu ufność mą, zawsze ufam Jego słowu."}, {"title": "Powietrze już drga", "body": "[Zwrotka 1]\nE                H\nRuszamy w drogę, jeden łączy nas cel\nA                  H           A H\nWe wspólnej wędrówce spotkaliśmy się\nE             H\nJak Maryja chcemy przyjąć Twój plan\nA               H       A H\nTo my Twoi słudzy wołamy co dnia\ncis        Gis\nOjcze nasz, Panie nasz\nE          H           A H\nNiech dziś wola Twa wypełni się w nas\ncis        Gis\nChcemy jak Matka Twa\nE            H             A H\nOtwierać swe serca na łaski tej dar\n\n[Refren]\nE                 H\nWszyscy słyszą nasz radosny głos\nA             H               A H  A H\nPodnosimy swe ręce, powietrze już drga\nE             H\nJezus żyje, nie zostawi nas\nA           H          E\nJuż teraz na miłość jest czas\n\n[Zwrotka 2]\nE                 H\nTy, co ciągle poszukujesz swych dróg\nA               H             A H  A H\nPosłuchaj uważnie, co mówi Ci Bóg\nE                         H\nSpróbuj z nami podnieść w górę swój wzrok\nA               H              A H  A H\nGdy tracisz nadzieję, bo zgubiłeś gdzieś\ncis          Gis\nuśmiech Twój, miłość Twą\nE           H           A H\nOdzyskasz je znów, zaufaj bo On\ncis         Gis\ndobrze zna serca głos\nE                 H           A H\nI ruszaj bez strachu, zrób pierwszy krok!\n\n[Refren]\nE                 H\nWszyscy słyszą nasz radosny głos\nA             H               A H  A H\nPodnosimy swe ręce, powietrze już drga\nE             H\nJezus żyje, nie zostawi nas\nA           H          E\nJuż teraz na miłość jest czas\n\n[Zwrotka 3]\nE                       H\nTo Maryja pierwsza znała ten dar\nA               H               A H  A H\nMiłości bez końca, co zawsze już trwa\nE               H\nZaufała, nauczyła nas jak\nA               H                 A H  A H\nPrzyjmować do serca Jezusa, gdy On\ncis       Gis\nDaje nam Ciało Swe\nE            H           A H\nJa przyjąć Go chcę, podnoszę swój głos,\ncis          Gis\nWołam On Panem mym\nE          H            A H\nJa ufam Jemu, a On ufa mi!\n\n[Refren]\nE                 H\nWszyscy słyszą nasz radosny głos\nA             H               A H  A H\nPodnosimy swe ręce, powietrze już drga\nE             H\nJezus żyje, nie zostawi nas\nA           H          E\nJuż teraz na miłość jest czas\n\n[Zwrotka 4]\nE                  H\nNie zwątpiła w obietnicę Twą\nA             H              A H  A H\nMaryja, tak młoda, nie bała się wstać\nE                         H\nI z pośpiechem wyruszyć na górski szlak\nA               H           A H  A H\nJej krewna Elżbieta witała ją tak:\ncis          Gis\n„Raduj się, chwała Ci,\nE          H                     A H\nBo owoc Twej wiary, Syn Jezus, nasz Pan”\ncis          Gis\nI ja też słyszeć chcę\nE             H                 A H\n„Twa wiara wystarczy, nie lękaj się!\"\n\n[Refren]\nE                 H\nWszyscy słyszą nasz radosny głos\nA             H               A H  A H\nPodnosimy swe ręce, powietrze już drga\nE             H\nJezus żyje, nie zostawi nas\nA           H          E  (x4)\nJuż teraz na miłość jest czas"}, {"title": "Prawda jedyna", "body": "D A fis cis\nPrawda jedyna słowa Jezusa z Nazaretu,\nD A fis cis\nże swego syna posłał z niebios Bóg na świat.\nD A fis cis\nAby niewinnie cierpiąc zmarł za nasze grzechy\nD A fis cis\ni w pohańbieniu przyjął winy wszystkich nas.\n\nD A fis cis D\nDzięki Ci Boże mój za ten krzyż, który Jezus\nA fis cis\ncierpiał za mnie, Jezus cierpiał za mnie.\n\nD A fis cis\nUwierz w Jezusa, przecież On za ciebie umarł\nD A fis cis\ni z miłości do nas przyszedł z nieba na ten świat.\nD A fis cis\nBłogosławiony ten, kto wierzy, choć nie widział\nD A fis cis\nzaufaj dziś Bogu a na wieki będziesz żył.\n\nD A fis cis D\nDzięki Ci Boże mój za ten krzyż, który Jezus\nA fis cis\ncierpiał za mnie, Jezus cierpiał za mnie."}, {"title": "Przenikasz mnie (Guadalupe)", "body": "a C\n1. Przenikasz i znasz mnie Panie,\na F G\nznasz moje słabości i cierpienia.\na C\nPrzenikasz i znasz mnie Panie,\nF C G\nmoje łzy i poświęcenie.\n\nF d\nRef. Tylko w Tobie prawda jest,\na G\nnie co mówią, nie co myślą.\nF d\nTylko Ty mnie Panie znasz,\na G\ndo głębi przenikasz mnie.\nF d\nTylko w Tobie prawda jest,\na G\nnie co mówię, nie co myślę.\nF d\nTylko Ty mnie Panie znasz,\na G\nw pełni.\n\ninstrumental F C d a F C G a\n\n2. I dobrze znasz moją duszę, /\t\ntak cenna jest w Twoich oczach.\nZnasz moje uczucia i pragnienia, /\nnie tajne Ci moje roztargnienia.\n\nRef. Tylko w Tobie prawda jest…\n\ninstrumental F C d a F C G a\n\nF G\nBridge: Wszystko co mam to Ty\n\nRef. Tylko w Tobie prawda jest…"}, {"title": "Przybądź Święty Niepojęty", "body": "1.\nA            C               D             A\nJęzyku ognia przyjdź i płoń w naszych sercach,\nD               A\nDuchu Miłości przemieniaj nas.\nA               C           D         A\nSwe pocieszenie nam daj i nim wypełniaj,\nD               A\nDuchu Nadziei umacniaj nas.\n\nRef.\nA E      fis          D          A\nPrzybądź Święty Niepojęty, z Nieba na nas tchnięty Duchu,\nA               E          fis          D          A\nRozpal Świętą, Niepojętą, z Nieba na nas tchniętą miłość,\nD           A\nNią ogarnij nas, Amen.\nD           A\nNią ogarnij nas, Amen.\n\n2.\nA               C                  D        A\nObłoku jasny chroń nas przed gniewem złego,\nD               A\nDaj soli smak i światłu blask.\nA               C                  D          A\nNie daj się ukryć miastu Boga przedwiecznego,\nD                   A\nOsłaniaj je, strzeż jego bram.\n\nRef.\nA  E     fis          D          A\nPrzybądź Święty Niepojęty, z Nieba na nas tchnięty Duchu,\nA               E          fis          D          A\nRozpal Świętą, Niepojętą, z Nieba na nas tchniętą miłość,\nD           A\nNią ogarnij nas, Amen.\nD           A\nNią ogarnij nas, Amen.\n\n3.\nA               C             D         A\nPocieszycielu radość Swą ześlij z Nieba,\nD                 A\nWszak Dobry ją obiecał nam.\nA               C               D            A\nPrzerwij milczenie w Imię Syna - Słowa - Chleba,\nD                   A\nNajświętsze tchnienie wołaj w nas.\n\nRef.\nA        E          fis          D          A\nPrzybądź Święty Niepojęty, z Nieba na nas tchnięty Duchu,\nA               E          fis          D          A\nRozpal Świętą, Niepojętą, z Nieba na nas tchniętą miłość,\nD           A\nNią ogarnij nas, Amen.\nA        E          fis          D          A\nPrzybądź Święty Niepojęty, z Nieba na nas tchnięty Duchu,\nA               E          fis          D          A\nRozpal Świętą, Niepojętą, z Nieba na nas tchniętą miłość,\nD           A\nNią ogarnij nas, Amen.\nD           A\nNią ogarnij nas, Amen.\n\n[Instrumental] \n\nA               E          fis          D          A\nWitaj Święty Niepojęty, z Nieba na nas tchnięty Duchu,\nA               E          fis          D          A\nRozpal Świętą, Niepojętą, z Nieba na nas tchniętą miłość,\nD           A\nNią ogarnij nas, Amen.\nD           A\nNią ogarnij nas, Amen."}, {"title": "Przychodzisz, Panie", "body": "F g7/F C A7+ A7\nPrzychodzisz, Panie, mimo drzwi zamkniętych,\nd B7+ g7 A7 B C7\nJezu Zmartwychwstały, ze śladami męki.\nF g7/F C A7+ A7\nTy jesteś z nami, poślij do nas Ducha!\nd B7+ g7 A7 B7 A7 d\nPanie nasz i Boże, uzdrów nasze życie!"}, {"title": "Przyjaciela mam", "body": "C G a F\nPrzyjaciela mam, co pociesza mnie,\t\t\t\nGdy o Jego ramię oprę się.\nW Nim nadzieję mam, uleciał strach.\nOn najbliżej jest, zawsze troszczy się.\nKrólów Król, z nami Bóg. /2x\t\t Jezus. /4x"}, {"title": "Psalm 126 (niemaGotu)", "body": "1.\nfis         cis          H         A           E\nGdy Pan odmienił los Syjonu, wydawało się nam, że śnimy!\nfis         cis               H             A      E\nUsta nasze były pełne śmiechu, a język śpiewał z radości!\n\nRef.\nH               A\nMówiono wtedy między narodami:\nE              H\n„Wielkie rzeczy im Pan uczynił!”\nfis           A\nPan uczynił nam wielkie rzeczy\nE   H          fis cis H A E\ni radość nas ogarnęła!\n\n2.\nfis             cis             H          A   E\nCi, którzy we łzach sieją, żąć będą w radości;\nfis            cis           H              A\nchoć idą i płaczą, niosąc ziarno na zasiew,\nE\npowrócą z radością, niosąc swoje snopy.\n\nRef.\nH               A\nPowiedzą wtedy między narodami:\nE              H\n„Wielkie rzeczy im Pan uczynił!”\nfis           A\nPan uczynił nam wielkie rzeczy\nE   H          fis cis H A E\ni radość nas ogarnęła!\n\nfis cis H A E\nOoo… /2x\n\nBridge:\nfis\nOdmień, Panie, nasz los!\ncis                      H\nZamień suche doliny w strumienie rwące!\nfis\nOdmień, Panie, nasz los!\ncis                              H\nNiech nawiedzi nas z wysoka wschodzące Słońce!\nfis\nOdmień, Panie, nasz los!\ncis                          H\nLament zamień w taniec! Rozpal znów, co gasnące!\nfis\nOdmień, Panie, nasz los!\nA        H        cis\nW Twoich rękach nasz los – odmień go!\n\nRef.\nH                       A\nA zawsze mówić będą między narodami:\nE              H\n„Wielkie rzeczy im Pan uczynił!”\nfis           A\nPan uczynił nam wielkie rzeczy\nE   H          fis cis H A E\ni radość nas ogarnęła!\n\nH                       A\nNiech mówią przeto między narodami:\nE              H\n„Wielkie rzeczy im Pan uczynił!”\nfis           A\nPan uczynił nam wielkie rzeczy\nE   H          fis cis H A E\ni radość nas ogarnęła!"}, {"title": "Psalm 148", "body": "Ref.\na   G   F   E a\nAlleluja /4x\n\n1.\na                 G        a\nNiech zabrzmi Panu chwała w niebiosach,\nG              C     G         a\nNa wysokościach cześć niech oddadzą,\nF               G          a\nWielbijcie Pana Duchy niebieskie,\na         e      a\nWielbijcie Pana Jego zastępy.\n\nRef.\na   G   F   E a\nAlleluja /4x\n\n2.\na               G          a\nSłońce, księżycu wielbijcie Pana,\nG               C        G         a\nGwiazdy świecące wielbijcie Pana,\nF               G        a\nNiebiosa niebios wielbijcie Pana,\na             e          a\nWody podniebne wielbijcie Pana.\n\nRef.\na   G   F   E a\nAlleluja /4x\n\n3.\na                  G        a\nNiech wszyscy wielbią imię Pana,\nG            C            G            a\nBo Jego Słowo stwarza wciąż wszystko,\nF                G         a\nBo tylko Jego imię jest wzniosłe,\na                   e            a\nNiechaj na wieki brzmi Jego chwała.\n\nRef.\na   G   F   E a\nAlleluja /4x\n\n4.\na               G     a\nOn daje siłę swemu ludowi,\nG               C             G     a\nZ prochu podnosi swoich przyjaciół,\nF                 G         a\nJest Bogiem bliskim dla Izraela,\na               e          a\nSwoich wybranych On sam umacnia.\n\nRef.\na   G   F   E a\nAlleluja /4x\n\n5.\na                 G            a\nNiech zabrzmi chwała Ojcu, co stwarza,\nG            C           G     a\nJego Synowi, który jest Panem,\nF             G              a\nDuchowi, który w nas zamieszkuje,\na               e           a\nPrzez wszystkie wieki wieków. Amen.\n\nRef.\na   G   F   E a\nAlleluja /4x"}, {"title": "Rozpięty na ramionach", "body": "a C G F a E\nRef. Rozpięty na ramionach jak sokół na niebie\na C G F a E\n      Chrystusie, Synu Boga, spójrz, proszę, na ziemię.\n\na F G a\n1. Na ruchliwe ulice, zabieganych ludzi,\nF G a E\n   Gdy noc się już kończy, a ranek się budzi.\na F G a\n   Uśmiechnij się przyjaźnie z wysokiego krzyża\nF G a E\n   Do ciężko pracujących, których głód poniża.\n\na C G F a E\nRef. Rozpięty na ramionach jak sokół na niebie\na C G F a E\n      Chrystusie, Synu Boga, spójrz, proszę, na ziemię.\n\na F G a\n2. Pociesz zrozpaczonych, chleba daj głodującym,\nF G a E\n Modlących się wysłuchaj i wybacz umierającym.\na F G a\n   O spójrz cierpliwie, sokole, na wszechświat, na ziemię,\nF G a E\n   Na cichy ciemny kościół, dziecko wzywające Ciebie.\n\na C G F a E\nRef. Rozpięty na ramionach jak sokół na niebie\na C G F a E\n      Chrystusie, Synu Boga, spójrz, proszę, na ziemię.\n\na F G a\n3. A gdy będziesz nas sądził, Boskie Miłosierdzie,\nF G a E\n   Prosimy, Twoje dzieci, nie sądź na miarę siebie."}, {"title": "Schowaj mnie", "body": "C G a F D G\n1. Schowaj mnie pod skrzydła Swe,\nC G a F d G\n   Ukryj mnie w silnej dłoni Swej.\n\nF G C\nRef. Kiedy fale mórz chcą porwać mnie,\nF G a\n     Z Tobą wzniosę się, podniesiesz mnie,\nF G C\n     Panie, Królem Tyś spienionych wód,\nF G a (C)\n     Ja ufam Ci, Ty jesteś Bóg.\n\n2. Odpocznę dziś w ramionach Twych.\n   Dusza ma przy Tobie będzie trwać."}, {"title": "Stoję dziś", "body": "A E H cis\nStoję dziś, swoje serce, ręce tak wyciągam\nW podziwie dla Tego, który wszystko dał!\nStoję dziś, moją duszę, Panie, Tobie składam,\nJa chcę być jak Ty"}, {"title": "Stwórca nasz", "body": "E\nStwórca nasz i Król\nA\nWszechmogący Bóg\nFis H\nChwałę dziś oddajmy Mu\tx2\n\nA H\nTwoje jest światło – niech chwali Cię\nA H\nNiebo i morza - niech chwalą Cię\nA A H\nTwoja jest cała ziemia – niech Ci składa hołd\n\nA H\nTwoje są gwiazdy – niech chwalą Cię\nA H\nWszelkie stworzenie – niech chwali Cię\nA H E\nTwoja jest moja dusza – niech Ci składa hołd\n\nE\nStwórca nasz i Król\nA\nWszechmogący Bóg\nFis H (E)\nChwałę dziś oddajmy Mu\tx2"}, {"title": "Tak mnie skrusz", "body": "d\nTak mnie skrusz,\nTak mnie złam,\nF\nTak mnie wypal, o Panie,\nC d A\nByś został tylko Ty, byś został tylko Ty jedynie Ty!"}, {"title": "To i ja", "body": "ZWROTKA 1\nE\nStwórco istnienia\ngis\nZanim był czas\nFis E (gis Fis)\nZanim rozpoczął się świat\nE\nGdzie chaos i ciemność\ngis\nNa dźwięk Twoich słów\nFis E (H Fis)\nNagle pojawił się blask\n\nREFREN 1\nH\nI na Twój głos\nH gis Fis\nGalaktyk sto miliardów rodzi się\nFis H E\nA oddech Twój początkiem planet jest\ngis Fis H\nJeśli gwiazdy Ciebie wielbią, to i ja\nH gis Fis\nWidzę serce Twoje w każdym z Twoich dzieł\nFis\nŚwiatło wszystkich gwiazd\nH E\nOdbiciem łaski jest\ngis Fis H\nJeśli wszechświat Ciebie chwali, to i ja\nH gis Fis\nTo i ja\n(Fis H)\nZWROTKA 2\nE\nBoże obietnic\ngis\nTwe słowo ma moc\nFis E (gis Fis)\nNa wieki nie zmieni się już\nE gis\nTy raz przemówiłeś nauka i świat\nFis E (H Fis)\nIdą za dźwiękiem Twych słów\n\nREFREN 2\nH\nI na Twój głos\nH gis Fis\nZe sto miliardów stworzeń bierze wdech\nFis H E\nBy Twój odwieczny plan wypełnił się\ngis Fis H\nJeśli to objawia Ciebie, to i ja\nH gis Fis\nWidzę serce Twoje w każdym z Twoich dzieł\nFis\nNiebo pełne barw\nH E\nObrazem łaski jest\ngis Fis H\nJeśli wszystko słucha Ciebie, to i ja\nH gis Fis (Fis H)\nTo i ja\nBRIDGE\nE gis Fis\nJeśli gwiazdy Ciebie wielbią, to i ja\nE gis Fis\nJeśli góry się kłaniają, to i ja\nE gis Fis\nJeśli morza głoszą chwałę, to i ja\nE gis Fis\nJeśli wszystko Cię wywyższa, Stwórco nasz\nE gis Fis\nTo i ja\n\nE gis Fis\nJeśli wiatr Ci jest posłuszny, to i ja\nE gis Fis\nJeśli kamień głos podnosi, to i ja\nE gis Fis\nWiem, że więcej niż to wszystko jesteś wart\nE gis Fis\nWięc zaśpiewam na Twą chwałę jeszcze raz\nE gis Fis\nooo\tx2\nUwielbiony bądź, Błogosławiony bądź x2\n\nZWROTKA 3\nE gis Fis\nBoże zbawienia\nZnalazłeś mnie, gdy\nE gis Fis\nZgubiła mnie duma i grzech\nE gis Fis\nNa górze cierpienia\nJedyny Twój Syn\nBył za mnie wydany na śmierć \t\t\t\tE ( H Fis)\n\nREFREN 3\nH\nI na Twój głos\nH gis Fis\nZe sto miliardów błędów znika gdzieś\nFis H E\nŻycia zrzekłeś się, by mi darować je\ngis Fis H\nJeśli Ty powstałeś z martwych, to i ja\nH gis Fis\nWidzę serce Twoje w każdej z Twoich ran\nFis H E\nArcydzieło Twe na imię Miłość ma\ngis Fis H\nJeśli Ty się uniżyłeś, to i ja\nH\nWidzę serce Twe\ngis Fis\nW miliardach wszystkich nas\nFis\nKażdy cenny jest\nH E\nImiona wszystkich znasz\ngis Fis H\nJeśli żyłeś, żeby kochać, to i ja\nH gis Fis\nWiem, że zrobiłbyś to wszystko jeszcze raz\nFis H E\nUkochałeś nas już zani <script>
(function(){
  const SONGS = JSON.parse(document.getElementById('song-data').textContent);

  const listContainer = document.getElementById('listContainer');
  const searchInput = document.getElementById('search');
  const clearBtn = document.getElementById('clearBtn');
  const countEl = document.getElementById('count');
  const detailView = document.getElementById('detail-view');
  const detailTitle = document.getElementById('detailTitle');
  const songBody = document.getElementById('song-body');
  const backBtn = document.getElementById('backBtn');
  const fontMinus = document.getElementById('fontMinus');
  const fontPlus = document.getElementById('fontPlus');

  function normalize(s){
    return s.toLowerCase()
      .replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l')
      .replace(/ń/g,'n').replace(/ó/g,'o').replace(/ś/g,'s').replace(/ź/g,'z').replace(/ż/g,'z');
  }

  const songsIndexed = SONGS.map((s,i) => ({...s, idx:i, norm: normalize(s.title)}));

  function render(filterText){
    const q = normalize(filterText || '');
    const filtered = q ? songsIndexed.filter(s => s.norm.includes(q)) : songsIndexed;

    countEl.textContent = filtered.length === songsIndexed.length
      ? (songsIndexed.length + ' pieśni')
      : ('Znaleziono: ' + filtered.length);

    if(filtered.length === 0){
      listContainer.innerHTML = '<div class="empty">Brak wyników dla podanej frazy.</div>';
      return;
    }

    let html = '';
    let lastLetter = null;
    let ul = '';
    filtered.forEach(s => {
      const letter = s.title.charAt(0).toUpperCase();
      if(letter !== lastLetter){
        if(ul){ html += '<ul class="songs">' + ul + '</ul>'; ul = ''; }
        html += '<div class="letter-header">' + letter + '</div>';
        lastLetter = letter;
      }
      ul += '<li><button data-idx="' + s.idx + '">' + escapeHtml(s.title) + '<span class="chev">›</span></button></li>';
    });
    if(ul){ html += '<ul class="songs">' + ul + '</ul>'; }
    listContainer.innerHTML = html;
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // Heuristic: a line is a "chord line" if, once split on whitespace, every
  // token looks like a chord symbol (e.g. G, Am, h, fis, D/Fis, C7, A7+, cis)
  const CHORD_TOKEN = /^\(?[A-HZ][a-z#b0-9\+\/\.\|\-]*\)?$/;
  function isChordLine(line){
    const trimmed = line.trim();
    if(!trimmed) return false;
    const tokens = trimmed.split(/\s+/);
    if(tokens.length === 0) return false;
    let chordish = 0;
    tokens.forEach(t => { if(CHORD_TOKEN.test(t)) chordish++; });
    return chordish / tokens.length >= 0.8 && /[A-Ha-h]/.test(trimmed);
  }
  function isRefLine(line){
    return /^\s*(Ref\.?|Refren|REFREN|Bridge|BRIDGE|Coda)\b/i.test(line);
  }

  function openSong(idx){
    const s = SONGS[idx];
    detailTitle.textContent = s.title;
    const lines = s.body.split('\n');
    const frag = document.createDocumentFragment();
    songBody.innerHTML = '';
    lines.forEach((line, i) => {
      const span = document.createElement('span');
      if(isChordLine(line)) span.className = 'chord-line';
      else if(isRefLine(line)) span.className = 'ref-line';
      span.textContent = line;
      frag.appendChild(span);
      if(i < lines.length - 1) frag.appendChild(document.createTextNode('\n'));
    });
    songBody.appendChild(frag);
    detailView.classList.add('open');
    document.getElementById('song-body-wrap').scrollTop = 0;
    history.pushState({song:idx}, '', '#song-' + idx);
  }

  function closeSong(){
    detailView.classList.remove('open');
    if(location.hash.startsWith('#song-')) history.back();
  }

  listContainer.addEventListener('click', e => {
    const btn = e.target.closest('button[data-idx]');
    if(btn) openSong(parseInt(btn.dataset.idx,10));
  });

  backBtn.addEventListener('click', closeSong);
  window.addEventListener('popstate', () => { detailView.classList.remove('open'); });

  searchInput.addEventListener('input', () => {
    clearBtn.style.display = searchInput.value ? 'block' : 'none';
    render(searchInput.value);
  });
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    render('');
    searchInput.focus();
  });

  let fontSize = parseInt(localStorage.getItem('spiewnik_fontsize') || '15', 10);
  function applyFont(){
    songBody.style.fontSize = fontSize + 'px';
    localStorage.setItem('spiewnik_fontsize', String(fontSize));
  }
  fontMinus.addEventListener('click', () => { fontSize = Math.max(11, fontSize-1); applyFont(); });
  fontPlus.addEventListener('click', () => { fontSize = Math.min(26, fontSize+1); applyFont(); });
  applyFont();

  render('');

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
})();
</script>
