<style>
  :root{
    --bg:#0f172a; --bg2:#1e293b; --card:#1e293b; --card2:#243247;
    --text:#f1f5f9; --muted:#94a3b8; --accent:#facc15; --accent2:#fbbf24;
    --border:#334155; --chord:#fbbf24;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;
  }
  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  /* ---------- Header ---------- */
  header{
    padding:calc(14px + var(--safe-top)) 16px 12px;
    background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:5;
  }
  header h1{
    margin:0 0 10px; font-size:20px; font-weight:700; letter-spacing:.2px;
    display:flex; align-items:center; gap:8px;
  }
  header h1 .dot{color:var(--accent);}
  .search-wrap{position:relative;}
  #search{
    width:100%; padding:11px 38px 11px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:16px; outline:none;
  }
  #search:focus{border-color:var(--accent);}
  .search-wrap .clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); font-size:20px; padding:6px; cursor:pointer; display:none;
  }
  .count{color:var(--muted); font-size:12px; margin-top:8px;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex; gap:6px; margin-bottom:10px;}
  .tab-btn{
    flex:1; padding:8px 10px; border-radius:10px; border:1px solid var(--border);
    background:var(--card2); color:var(--muted); font-size:14px; font-weight:600; cursor:pointer;
  }
  .tab-btn.active{background:var(--accent); color:#1e1b0a; border-color:var(--accent);}

  /* ---------- List ---------- */
  #list-view{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .letter-header{
    position:sticky; top:0; background:var(--bg); color:var(--accent);
    font-size:12px; font-weight:700; padding:6px 16px; letter-spacing:1px;
    border-bottom:1px solid var(--border);
  }
  ul.songs{list-style:none; margin:0; padding:0 0 calc(24px + var(--safe-bottom));}
  ul.songs li{
    border-bottom:1px solid var(--border);
  }
  ul.songs li button{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:14px 16px; font-size:16px; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer;
  }
  ul.songs li button:active{background:var(--card2);}
  ul.songs li button .chev{color:var(--muted); font-size:18px;}
  .empty{padding:40px 20px; text-align:center; color:var(--muted);}

  /* ---------- Playlists (setlisty) pane ---------- */
  #playlistsPane{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(24px + var(--safe-bottom));}
  .pl-toolbar{padding:4px 16px 14px;}
  .pl-new-btn{
    width:100%; padding:12px; border-radius:12px; border:1px dashed var(--accent);
    background:none; color:var(--accent); font-size:15px; font-weight:700; cursor:pointer;
  }
  .pl-new-btn:active{background:var(--card2);}
  .pl-sync-btn{
    width:100%; margin-top:8px; padding:10px; border-radius:12px; border:1px solid var(--border);
    background:var(--card2); color:var(--muted); font-size:13px; cursor:pointer;
  }
  .pl-sync-btn.active{color:var(--accent); border-color:var(--accent);}
  ul.playlists{list-style:none; margin:0; padding:0;}
  ul.playlists li{
    display:flex; align-items:center; border-bottom:1px solid var(--border);
  }
  ul.playlists li button.pl-open{
    flex:1; text-align:left; background:none; border:none; color:var(--text);
    padding:14px 16px; font-size:16px; cursor:pointer; display:flex; flex-direction:column; gap:2px;
  }
  ul.playlists li button.pl-open:active{background:var(--card2);}
  ul.playlists li .pl-count{color:var(--muted); font-size:12px;}
  .pl-del{
    background:none; border:none; color:var(--muted); font-size:20px; padding:14px 16px; cursor:pointer;
  }
  .pl-del:active{color:#f87171;}

  /* ---------- Detail view (Z-INDEX POPRAWIONY NA 20) ---------- */
  #detail-view{
    position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:20;
  }
  #detail-view.open{display:flex;}
  .detail-header{
    padding:calc(12px + var(--safe-top)) 8px 10px 8px;
    background:var(--bg2); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px;
  }
  .back-btn{
    background:none; border:none; color:var(--accent); font-size:16px; padding:8px 10px;
    display:flex; align-items:center; gap:4px; cursor:pointer; border-radius:8px;
  }
  .back-btn:active{background:var(--card2);}
  .detail-title{
    flex:1; font-size:16px; font-weight:700; padding-right:8px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .font-controls{display:flex; gap:4px;}
  .font-controls button{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:16px; cursor:pointer;
  }
  #song-body-wrap{flex:1; overflow:auto; -webkit-overflow-scrolling:touch;}
  pre#song-body{
    margin:0; padding:18px 16px calc(40px + var(--safe-bottom));
    font-family:"SF Mono", "Roboto Mono", Menlo, Consolas, "Courier New", monospace;
    font-size:15px; line-height:1.55; white-space:pre; overflow-x:auto;
    tab-size:4; -moz-tab-size:4;
  }
  .chord-line{color:var(--chord); font-weight:700;}
  .ref-line{color:#38bdf8;}

  /* ---------- Add-to-setlist button ---------- */
  .pl-add-btn{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
    background:var(--card2); color:var(--accent); font-size:16px; cursor:pointer; margin-right:4px;
  }

  /* ---------- Playlist detail view ---------- */
  #playlist-detail-view, #playlist-picker-view{
    position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:10;
  }
  #playlist-detail-view.open{display:flex; z-index:10;}
  #playlist-picker-view.open{display:flex; z-index:15;}

  .pld-header-row{display:flex; align-items:center; gap:4px;}
  .pld-title-btn{
    flex:1; text-align:left; background:none; border:none; color:var(--text);
    font-size:16px; font-weight:700; padding:8px 4px; cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pld-icon-btn{
    background:none; border:none; color:var(--muted); font-size:18px; padding:8px; cursor:pointer;
  }
  .pld-icon-btn:active{color:var(--accent);}
  #playlistSongsContainer{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .pld-empty{padding:40px 20px; text-align:center; color:var(--muted);}
  ul.pld-songs{list-style:none; margin:0; padding:8px 0 calc(80px + var(--safe-bottom));}
  ul.pld-songs li{
    display:flex; align-items:center; gap:2px; border-bottom:1px solid var(--border); padding:0 8px;
  }
  ul.pld-songs li .pld-num{color:var(--muted); font-size:13px; width:22px; text-align:right; flex-shrink:0;}
  ul.pld-songs li button.pld-song-btn{
    flex:1; text-align:left; background:none; border:none; color:var(--text);
    padding:13px 8px; font-size:15px; cursor:pointer; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  ul.pld-songs li .pld-controls{display:flex; gap:2px; flex-shrink:0;}
  ul.pld-songs li .pld-controls button{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border);
    background:var(--card2); color:var(--muted); font-size:14px; cursor:pointer;
  }
  ul.pld-songs li .pld-controls button:disabled{opacity:.3;}
  ul.pld-songs li .pld-controls button.pld-remove{color:#f87171;}
  .pld-add-footer{
    position:sticky; bottom:0; padding:12px 16px calc(12px + var(--safe-bottom));
    background:linear-gradient(0deg,var(--bg) 60%, transparent); 
  }
  .pld-add-btn{
    width:100%; padding:12px; border-radius:12px; border:none;
    background:var(--accent); color:#1e1b0a; font-size:15px; font-weight:700; cursor:pointer;
  }

  /* ---------- Playlist picker (add songs) ---------- */
  #pickerListContainer{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  ul.picker-songs{list-style:none; margin:0; padding:0 0 calc(24px + var(--safe-bottom));}
  ul.picker-songs li button{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:14px 16px; font-size:16px; display:flex; align-items:center; gap:12px; cursor:pointer;
  }
  ul.picker-songs li button:active{background:var(--card2);}
  .picker-check{
    width:22px; height:22px; border-radius:6px; border:2px solid var(--border);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .picker-check.checked{background:var(--accent); border-color:var(--accent); color:#1e1b0a; font-weight:700;}

  /* ---------- Quick add-to-setlist modal ---------- */
  #quickAddBackdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:30;
    align-items:flex-end; justify-content:center;
  }
  #quickAddBackdrop.open{display:flex;}
  #quickAddSheet{
    width:100%; max-width:480px; background:var(--bg2); border-radius:16px 16px 0 0;
    border:1px solid var(--border); border-bottom:none;
    padding:16px 16px calc(16px + var(--safe-bottom)); max-height:70vh; overflow-y:auto;
  }
  #quickAddSheet h3{margin:0 0 12px; font-size:15px; color:var(--muted); font-weight:700;}
  ul.quick-pl-list{list-style:none; margin:0 0 12px; padding:0;}
  ul.quick-pl-list li button{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:12px 4px; font-size:15px; display:flex; align-items:center; gap:12px; cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .quick-new-row{display:flex; gap:8px; margin-top:4px;}
  .quick-new-row button{
    padding:10px 14px; border-radius:10px; border:1px dashed var(--accent);
    background:none; color:var(--accent); font-size:14px; font-weight:700; cursor:pointer; width:100%;
  }

  /* ---------- Custom dialog ---------- */
  #customDialogBackdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:40;
    align-items:center; justify-content:center; padding:20px;
  }
  #customDialogBackdrop.open{display:flex;}
  #customDialogSheet{
    width:100%; max-width:360px; background:var(--bg2); border-radius:16px;
    border:1px solid var(--border); padding:20px;
  }
  #customDialogMessage{
    margin:0 0 14px; font-size:15px; color:var(--text); line-height:1.4; white-space:pre-line;
  }
  #customDialogInput{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:16px; outline:none; margin-bottom:16px; box-sizing:border-box;
  }
  #customDialogInput:focus{border-color:var(--accent);}
  .dialog-buttons{display:flex; gap:10px; justify-content:flex-end;}
  .dialog-buttons button{
    padding:10px 18px; border-radius:10px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:14px; font-weight:700; cursor:pointer;
  }
  #customDialogOk{background:var(--accent); color:#1e1b0a; border-color:var(--accent);}
</style>
</head>

<div id="debugErrorBanner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#dc2626; color:#fff; padding:10px 14px; font-family:monospace; font-size:12px; white-space:pre-wrap; max-height:45vh; overflow:auto; box-sizing:border-box;"></div>
<script>
(function(){
  var banner = document.getElementById('debugErrorBanner');
  function show(msg){
    banner.style.display = 'block';
    banner.textContent += (banner.textContent ? '\n\n---\n\n' : '') + msg;
  }
  window.addEventListener('error', function(e){
    show('BŁĄD JS: ' + e.message + '\nplik: ' + (e.filename||'?') + ' linia:' + (e.lineno||'?') + ' kol:' + (e.colno||'?'));
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    var msg = (r && r.message) ? r.message : String(r);
    show('NIEOBSŁUŻONY BŁĄD (Promise): ' + msg);
  });
  window.__spiewnikDebugShow = show;
})();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADWqBD7BHltXrtEPq5nzcQPXbj_EFb1ME",
    authDomain: "spiewnik-adonaj.firebaseapp.com",
    projectId: "spiewnik-adonaj",
    storageBucket: "spiewnik-adonaj.firebasestorage.app",
    messagingSenderId: "1057517558031",
    appId: "1:1057517558031:web:74614b50afe7ff7180867a"
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);
  const fbDb = getFirestore(fbApp);

  let authReadyPromise = null;
  function ensureAuth(){
    if(!authReadyPromise){
      authReadyPromise = new Promise((resolve) => {
        onAuthStateChanged(fbAuth, user => {
          if(user) resolve(user);
          else signInAnonymously(fbAuth).catch(() => resolve(null));
        });
      });
    }
    return authReadyPromise;
  }

  function getSyncCode(){
    return localStorage.getItem('spiewnik_sync_code') || '';
  }

  let syncUnsub = null;

  async function connectSync(code, onRemoteUpdate){
    if(syncUnsub){ syncUnsub(); syncUnsub = null; }
    localStorage.setItem('spiewnik_sync_code', code);
    await ensureAuth();
    const ref = doc(fbDb, 'syncs', code);
    const snap = await getDoc(ref);
    if(snap.exists()){
      const remote = (snap.data() && snap.data().playlists) || [];
      localStorage.setItem('spiewnik_playlists', JSON.stringify(remote));
      onRemoteUpdate(remote);
    } else {
      const local = JSON.parse(localStorage.getItem('spiewnik_playlists') || '[]');
      await setDoc(ref, { playlists: local, updatedAt: Date.now() });
    }
    syncUnsub = onSnapshot(ref, (snap2) => {
      if(snap2.metadata.hasPendingWrites) return;
      const remote = (snap2.data() && snap2.data().playlists) || [];
      localStorage.setItem('spiewnik_playlists', JSON.stringify(remote));
      onRemoteUpdate(remote);
    }, () => {});
  }

  function disconnectSync(){
    if(syncUnsub){ syncUnsub(); syncUnsub = null; }
    localStorage.removeItem('spiewnik_sync_code');
  }

  async function pushToCloudIfConnected(list){
    const code = getSyncCode();
    if(!code) return;
    try {
      await ensureAuth();
      const ref = doc(fbDb, 'syncs', code);
      await setDoc(ref, { playlists: list, updatedAt: Date.now() });
    } catch(e){}
  }

  // Helper: Bezpieczne kodowanie HTML
  function escapeHtml(str){
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Helper: Normalizacja tekstu do wyszukiwania
  function normalizeText(str){
    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  // Weryfikacja czy linia zawiera akordy
  function isChordLine(line){
    const trimmed = line.trim();
    if(!trimmed) return false;
    const tokens = trimmed.split(/\s+/);
    const chordRegex = /^[A-Ga-gHh](is|es)?(m|7|7\+|sus\d*|\d)*(\/[A-Ga-gHh](is|es)?)?$/i;
    let matches = 0;
    for(const token of tokens){
      const cleanToken = token.replace(/[\(\)\[\]]/g, '');
      if(!cleanToken) continue;
      if(chordRegex.test(cleanToken)) matches++;
    }
    return matches / tokens.length >= 0.6;
  }

  // Renderowanie tekstu pieśni z podświetleniem
  function renderSongBody(bodyText){
    const lines = bodyText.split('\n');
    return lines.map(line => {
      const trimmed = line.trim();
      if(isChordLine(trimmed)){
        return `<span class="chord-line">${escapeHtml(line)}</span>`;
      } else if(/^(\[?\d+\]?|Ref\b|Refren\b|Bridge\b|Przejście\b|Wstęp\b)/i.test(trimmed)){
        return `<span class="ref-line">${escapeHtml(line)}</span>`;
      }
      return escapeHtml(line);
    }).join('\n');
  }

  // Moduł własnego dialogu
  function customDialog({ message, input = false, defaultValue = '', okText = 'OK', cancelText = 'Anuluj', showCancel = true }){
    return new Promise((resolve) => {
      const backdrop = document.getElementById('customDialogBackdrop');
      const msgEl = document.getElementById('customDialogMessage');
      const inputEl = document.getElementById('customDialogInput');
      const cancelBtn = document.getElementById('customDialogCancel');
      const okBtn = document.getElementById('customDialogOk');

      msgEl.textContent = message;
      if(input){
        inputEl.style.display = 'block';
        inputEl.value = defaultValue;
      } else {
        inputEl.style.display = 'none';
      }
      cancelBtn.style.display = showCancel ? 'inline-block' : 'none';
      cancelBtn.textContent = cancelText;
      okBtn.textContent = okText;

      backdrop.classList.add('open');
      if(input) setTimeout(() => inputEl.focus(), 100);

      function cleanup(){
        backdrop.classList.remove('open');
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
      }
      function onOk(){
        cleanup();
        resolve(input ? inputEl.value : true);
      }
      function onCancel(){
        cleanup();
        resolve(input ? null : false);
      }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
    });
  }

  // Zarządzanie rozmiarem czcionki
  let currentFontSize = parseInt(localStorage.getItem('spiewnik_font_size') || '15', 10);
  const songBody = document.getElementById('song-body');
  function applyFontSize(){
    songBody.style.fontSize = currentFontSize + 'px';
    localStorage.setItem('spiewnik_font_size', currentFontSize);
  }
  document.getElementById('fontMinus').addEventListener('click', () => {
    if(currentFontSize > 10) { currentFontSize--; applyFontSize(); }
  });
  document.getElementById('fontPlus').addEventListener('click', () => {
    if(currentFontSize < 30) { currentFontSize++; applyFontSize(); }
  });
  applyFontSize();

  // Nawigacja zakładek
  const tabSongs = document.getElementById('tabSongs');
  const tabPlaylists = document.getElementById('tabPlaylists');
  const songsPane = document.getElementById('songsPane');
  const songsHeaderExtra = document.getElementById('songsHeaderExtra');
  const playlistsPane = document.getElementById('playlistsPane');

  function switchTab(tab){
    if(tab === 'songs'){
      tabSongs.classList.add('active');
      tabPlaylists.classList.remove('active');
      songsPane.style.display = 'block';
      songsHeaderExtra.style.display = 'block';
      playlistsPane.style.display = 'none';
    } else {
      tabSongs.classList.remove('active');
      tabPlaylists.classList.add('active');
      songsPane.style.display = 'none';
      songsHeaderExtra.style.display = 'none';
      playlistsPane.style.display = 'block';
      renderPlaylists();
    }
  }
  tabSongs.addEventListener('click', () => switchTab('songs'));
  tabPlaylists.addEventListener('click', () => switchTab('playlists'));

  // Lista pieśni i wyszukiwarka
  const searchInput = document.getElementById('search');
  const clearBtn = document.getElementById('clearBtn');
  const listContainer = document.getElementById('listContainer');
  const countEl = document.getElementById('count');

  function renderSongList(){
    const query = normalizeText(searchInput.value.trim());
    clearBtn.style.display = searchInput.value ? 'block' : 'none';

    const filtered = SONGS.filter(s => normalizeText(s.title).includes(query) || normalizeText(s.body).includes(query));
    countEl.textContent = `Liczba pieśni: ${filtered.length}`;

    if(filtered.length === 0){
      listContainer.innerHTML = '<div class="empty">Brak wyników</div>';
      return;
    }

    filtered.sort((a,b) => a.title.localeCompare(b.title, 'pl'));

    if(!query){
      const groups = {};
      filtered.forEach(s => {
        const letter = s.title.charAt(0).toUpperCase();
        if(!groups[letter]) groups[letter] = [];
        groups[letter].push(s);
      });

      let html = '';
      for(const letter of Object.keys(groups).sort((a,b) => a.localeCompare(b, 'pl'))){
        html += `<div class="letter-header">${letter}</div><ul class="songs">`;
        groups[letter].forEach(s => {
          const songIdx = SONGS.indexOf(s);
          html += `<li><button data-idx="${songIdx}"><span>${escapeHtml(s.title)}</span><span class="chev">›</span></button></li>`;
        });
        html += `</ul>`;
      }
      listContainer.innerHTML = html;
    } else {
      let html = '<ul class="songs">';
      filtered.forEach(s => {
        const songIdx = SONGS.indexOf(s);
        html += `<li><button data-idx="${songIdx}"><span>${escapeHtml(s.title)}</span><span class="chev">›</span></button></li>`;
      });
      html += '</ul>';
      listContainer.innerHTML = html;
    }
  }

  searchInput.addEventListener('input', renderSongList);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    renderSongList();
  });
  listContainer.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-idx]');
    if(btn){
      openSongDetail(parseInt(btn.dataset.idx, 10));
    }
  });

  // Widok szczegółowy pieśni
  let currentSongIndex = null;
  const detailView = document.getElementById('detail-view');
  const detailTitle = document.getElementById('detailTitle');
  const backBtn = document.getElementById('backBtn');

  function openSongDetail(index){
    currentSongIndex = index;
    const song = SONGS[index];
    detailTitle.textContent = song.title;
    songBody.innerHTML = renderSongBody(song.body);
    detailView.classList.add('open');
  }

  backBtn.addEventListener('click', () => {
    detailView.classList.remove('open');
  });

  // Zarządzanie setlistami
  function getPlaylists(){
    try {
      return JSON.parse(localStorage.getItem('spiewnik_playlists') || '[]');
    } catch(e){
      return [];
    }
  }

  function savePlaylists(list){
    localStorage.setItem('spiewnik_playlists', JSON.stringify(list));
    pushToCloudIfConnected(list);
  }

  const playlistsContainer = document.getElementById('playlistsContainer');
  const newPlaylistBtn = document.getElementById('newPlaylistBtn');
  const syncBtn = document.getElementById('syncBtn');

  function updateSyncBtnUI(){
    const code = getSyncCode();
    if(code){
      syncBtn.textContent = `🔄 Synchronizacja (Kod: ${code})`;
      syncBtn.classList.add('active');
    } else {
      syncBtn.textContent = '🔄 Synchronizacja wyłączona';
      syncBtn.classList.remove('active');
    }
  }

  function renderPlaylists(){
    updateSyncBtnUI();
    const list = getPlaylists();
    if(list.length === 0){
      playlistsContainer.innerHTML = '<div class="empty">Brak utworzonych setlist</div>';
      return;
    }

    let html = '<ul class="playlists">';
    list.forEach((pl) => {
      const count = (pl.songs || []).length;
      html += `
        <li>
          <button class="pl-open" data-pl-id="${pl.id}">
            <strong>${escapeHtml(pl.title)}</strong>
            <span class="pl-count">Pieśni: ${count}</span>
          </button>
          <button class="pl-del" data-del-id="${pl.id}" title="Usuń">🗑</button>
        </li>
      `;
    });
    html += '</ul>';
    playlistsContainer.innerHTML = html;
  }

  newPlaylistBtn.addEventListener('click', async () => {
    const name = await customDialog({ message: 'Podaj nazwę nowej setlisty:', input: true, defaultValue: 'Nowa setlista' });
    if(name && name.trim()){
      const list = getPlaylists();
      const newPl = { id: 'pl_' + Date.now(), title: name.trim(), songs: [] };
      list.push(newPl);
      savePlaylists(list);
      renderPlaylists();
      openPlaylistDetail(newPl.id);
    }
  });

  syncBtn.addEventListener('click', async () => {
    const currentCode = getSyncCode();
    if(currentCode){
      const disable = await customDialog({ message: `Aktualny kod synchronizacji: ${currentCode}\n\nCzy chcesz wyłączyć synchronizację?` });
      if(disable){
        disconnectSync();
        updateSyncBtnUI();
      }
    } else {
      const code = await customDialog({ message: 'Podaj wspólny kod synchronizacji (np. słowo lub PIN):', input: true });
      if(code && code.trim()){
        await connectSync(code.trim().toLowerCase(), (remoteList) => {
          renderPlaylists();
          if(activePlaylistId) renderPlaylistSongs(activePlaylistId);
        });
        updateSyncBtnUI();
      }
    }
  });

  playlistsContainer.addEventListener('click', async (e) => {
    const openBtn = e.target.closest('.pl-open');
    if(openBtn){
      openPlaylistDetail(openBtn.dataset.plId);
      return;
    }
    const delBtn = e.target.closest('.pl-del');
    if(delBtn){
      const confirmDel = await customDialog({ message: 'Czy na pewno chcesz usunąć tę setlistę?' });
      if(confirmDel){
        let list = getPlaylists();
        list = list.filter(p => p.id !== delBtn.dataset.delId);
        savePlaylists(list);
        renderPlaylists();
      }
    }
  });

  // Szczegóły konkretnej setlisty
  let activePlaylistId = null;
  const playlistDetailView = document.getElementById('playlist-detail-view');
  const pldBackBtn = document.getElementById('pldBackBtn');
  const pldTitleBtn = document.getElementById('pldTitleBtn');
  const pldDeleteBtn = document.getElementById('pldDeleteBtn');
  const playlistSongsContainer = document.getElementById('playlistSongsContainer');
  const pldAddSongBtn = document.getElementById('pldAddSongBtn');

  function openPlaylistDetail(plId){
    activePlaylistId = plId;
    const list = getPlaylists();
    const pl = list.find(p => p.id === plId);
    if(!pl) return;

    pldTitleBtn.textContent = pl.title;
    renderPlaylistSongs(plId);
    playlistDetailView.classList.add('open');
  }

  function renderPlaylistSongs(plId){
    const list = getPlaylists();
    const pl = list.find(p => p.id === plId);
    if(!pl) return;

    if(!pl.songs || pl.songs.length === 0){
      playlistSongsContainer.innerHTML = '<div class="pld-empty">Setlista jest pusta. Dodaj pieśni za pomocą przycisku poniżej.</div>';
      return;
    }

    let html = '<ul class="pld-songs">';
    pl.songs.forEach((songTitle, idx) => {
      const isFirst = idx === 0;
      const isLast = idx === pl.songs.length - 1;
      html += `
        <li>
          <span class="pld-num">${idx + 1}.</span>
          <button class="pld-song-btn" data-title="${escapeHtml(songTitle)}">${escapeHtml(songTitle)}</button>
          <div class="pld-controls">
            <button data-move="up" data-idx="${idx}" ${isFirst ? 'disabled' : ''}>↑</button>
            <button data-move="down" data-idx="${idx}" ${isLast ? 'disabled' : ''}>↓</button>
            <button class="pld-remove" data-remove="${idx}">✕</button>
          </div>
        </li>
      `;
    });
    html += '</ul>';
    playlistSongsContainer.innerHTML = html;
  }

  pldBackBtn.addEventListener('click', () => {
    playlistDetailView.classList.remove('open');
    activePlaylistId = null;
    renderPlaylists();
  });

  pldTitleBtn.addEventListener('click', async () => {
    if(!activePlaylistId) return;
    const list = getPlaylists();
    const pl = list.find(p => p.id === activePlaylistId);
    if(!pl) return;

    const newTitle = await customDialog({ message: 'Zmień nazwę setlisty:', input: true, defaultValue: pl.title });
    if(newTitle && newTitle.trim()){
      pl.title = newTitle.trim();
      savePlaylists(list);
      pldTitleBtn.textContent = pl.title;
      renderPlaylists();
    }
  });

  pldDeleteBtn.addEventListener('click', async () => {
    if(!activePlaylistId) return;
    const confirmDel = await customDialog({ message: 'Czy na pewno chcesz usunąć tę setlistę?' });
    if(confirmDel){
      let list = getPlaylists();
      list = list.filter(p => p.id !== activePlaylistId);
      savePlaylists(list);
      playlistDetailView.classList.remove('open');
      activePlaylistId = null;
      renderPlaylists();
    }
  });

  playlistSongsContainer.addEventListener('click', (e) => {
    const songBtn = e.target.closest('.pld-song-btn');
    if(songBtn){
      const title = songBtn.dataset.title;
      const songIdx = SONGS.findIndex(s => s.title === title);
      if(songIdx !== -1) openSongDetail(songIdx);
      return;
    }

    const moveBtn = e.target.closest('button[data-move]');
    if(moveBtn){
      const idx = parseInt(moveBtn.dataset.idx, 10);
      const dir = moveBtn.dataset.move;
      const list = getPlaylists();
      const pl = list.find(p => p.id === activePlaylistId);
      if(!pl) return;

      const targetIdx = dir === 'up' ? idx - 1 : idx + 1;
      if(targetIdx >= 0 && targetIdx < pl.songs.length){
        const temp = pl.songs[idx];
        pl.songs[idx] = pl.songs[targetIdx];
        pl.songs[targetIdx] = temp;
        savePlaylists(list);
        renderPlaylistSongs(activePlaylistId);
      }
      return;
    }

    const removeBtn = e.target.closest('button[data-remove]');
    if(removeBtn){
      const idx = parseInt(removeBtn.dataset.remove, 10);
      const list = getPlaylists();
      const pl = list.find(p => p.id === activePlaylistId);
      if(!pl) return;

      pl.songs.splice(idx, 1);
      savePlaylists(list);
      renderPlaylistSongs(activePlaylistId);
    }
  });

  // Picker pieśni do setlisty
  const playlistPickerView = document.getElementById('playlist-picker-view');
  const pickerBackBtn = document.getElementById('pickerBackBtn');
  const pickerSearch = document.getElementById('pickerSearch');
  const pickerClearBtn = document.getElementById('pickerClearBtn');
  const pickerListContainer = document.getElementById('pickerListContainer');

  pldAddSongBtn.addEventListener('click', () => {
    renderPickerList();
    playlistPickerView.classList.add('open');
  });

  pickerBackBtn.addEventListener('click', () => {
    playlistPickerView.classList.remove('open');
    renderPlaylistSongs(activePlaylistId);
  });

  function renderPickerList(){
    const query = normalizeText(pickerSearch.value.trim());
    pickerClearBtn.style.display = pickerSearch.value ? 'block' : 'none';

    const list = getPlaylists();
    const pl = list.find(p => p.id === activePlaylistId);
    const currentSongs = new Set((pl && pl.songs) || []);

    const sortedSongs = [...SONGS].sort((a,b) => a.title.localeCompare(b.title, 'pl'));
    const filtered = sortedSongs.filter(s => normalizeText(s.title).includes(query));

    let html = '<ul class="picker-songs">';
    filtered.forEach(s => {
      const isChecked = currentSongs.has(s.title);
      html += `
        <li>
          <button data-song-title="${escapeHtml(s.title)}">
            <div class="picker-check ${isChecked ? 'checked' : ''}">${isChecked ? '✓' : ''}</div>
            <span>${escapeHtml(s.title)}</span>
          </button>
        </li>
      `;
    });
    html += '</ul>';
    pickerListContainer.innerHTML = html;
  }

  pickerSearch.addEventListener('input', renderPickerList);
  pickerClearBtn.addEventListener('click', () => {
    pickerSearch.value = '';
    renderPickerList();
  });

  pickerListContainer.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-song-title]');
    if(!btn) return;
    const title = btn.dataset.songTitle;

    const list = getPlaylists();
    const pl = list.find(p => p.id === activePlaylistId);
    if(!pl) return;

    const idx = pl.songs.indexOf(title);
    if(idx === -1){
      pl.songs.push(title);
    } else {
      pl.songs.splice(idx, 1);
    }
    savePlaylists(list);
    renderPickerList();
  });

  // Szybkie dodawanie do setlisty (z widoku podglądu pieśni)
  const addToPlaylistBtn = document.getElementById('addToPlaylistBtn');
  const quickAddBackdrop = document.getElementById('quickAddBackdrop');
  const quickAddSongTitle = document.getElementById('quickAddSongTitle');
  const quickAddList = document.getElementById('quickAddList');
  const quickAddNewBtn = document.getElementById('quickAddNewBtn');

  addToPlaylistBtn.addEventListener('click', () => {
    if(currentSongIndex === null) return;
    const song = SONGS[currentSongIndex];
    quickAddSongTitle.textContent = song.title;
    renderQuickAddList();
    quickAddBackdrop.classList.add('open');
  });

  function renderQuickAddList(){
    const song = SONGS[currentSongIndex];
    const list = getPlaylists();

    if(list.length === 0){
      quickAddList.innerHTML = '<li style="padding:12px 4px; color:var(--muted); font-size:14px;">Brak utworzonych setlist.</li>';
      return;
    }

    let html = '';
    list.forEach(pl => {
      const hasSong = (pl.songs || []).includes(song.title);
      html += `
        <li>
          <button data-quick-pl-id="${pl.id}">
            <span style="font-size:18px; color:var(--accent);">${hasSong ? '✓' : '+'}</span>
            <span style="flex:1;">${escapeHtml(pl.title)}</span>
          </button>
        </li>
      `;
    });
    quickAddList.innerHTML = html;
  }

  quickAddBackdrop.addEventListener('click', (e) => {
    if(e.target === quickAddBackdrop){
      quickAddBackdrop.classList.remove('open');
    }
  });

  quickAddList.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-quick-pl-id]');
    if(!btn) return;

    const plId = btn.dataset.quickPlId;
    const song = SONGS[currentSongIndex];
    const list = getPlaylists();
    const pl = list.find(p => p.id === plId);

    if(pl){
      const idx = pl.songs.indexOf(song.title);
      if(idx === -1){
        pl.songs.push(song.title);
      } else {
        pl.songs.splice(idx, 1);
      }
      savePlaylists(list);
      renderQuickAddList();
    }
  });

  quickAddNewBtn.addEventListener('click', async () => {
    const song = SONGS[currentSongIndex];
    const name = await customDialog({ message: 'Podaj nazwę nowej setlisty:', input: true, defaultValue: 'Nowa setlista' });
    if(name && name.trim()){
      const list = getPlaylists();
      const newPl = { id: 'pl_' + Date.now(), title: name.trim(), songs: [song.title] };
      list.push(newPl);
      savePlaylists(list);
      quickAddBackdrop.classList.remove('open');
      customDialog({ message: `Dodano pieśń "${song.title}" do setlisty "${newPl.title}".`, showCancel: false });
    }
  });

  // Inicjalizacja synchronizacji i renderowanie
  const existingCode = getSyncCode();
  if(existingCode){
    connectSync(existingCode, (remote) => {
      renderPlaylists();
      if(activePlaylistId) renderPlaylistSongs(activePlaylistId);
    });
  }

  renderSongList();
})();
</script>
</body>
</html>
